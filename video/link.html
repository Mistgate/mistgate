<!doctype html>
<!-- One link per person: a new person, carol, gets one link (with its QR code), and it opens her own page: Add a device,
     an app, one tap that puts every server into it, her servers. Footage: `node record.mjs link-admin --lang <l>` and
     `link-phone` (see README.md). -->
<html data-composition-variables='[{"id":"lang","type":"enum","label":"Language","default":"en","options":[{"value":"en","label":"English"},{"value":"ru","label":"Русский"},{"value":"zh","label":"中文"}]}]'>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="film.css" />
  </head>
  <body>
    <div id="root" data-composition-id="link" data-start="0" data-duration="25.6" data-width="1920" data-height="1080" data-no-timeline>
      <div id="stage"></div>
      <div id="outro">
        <div class="lockup">
          <img src="assets/brand/mistgate-badge.svg" alt="" />
          <div class="word">mist<b>gate</b></div>
        </div>
        <div class="url">mistgate.app</div>
      </div>
    </div>
    <script src="film.js"></script>
    <script>
      const DURATION = 25.6;
      const captions = {
        en: ["Add a person: just a name", "carol gets one link and its QR code", "The link opens her own page", "Add a device: pick an app", "One tap puts every server into it", "Her servers are on the same page"],
        ru: ["Новый человек — нужно только имя", "У carol одна ссылка и QR-код к ней", "Ссылка ведёт на её собственную страницу", "Добавить устройство: выбрать приложение", "Одно нажатие добавит в него все серверы", "Её серверы — на той же странице"],
        zh: ["添加一个人，只要名字", "carol 有一个链接和对应的二维码", "链接打开她自己的页面", "添加设备：选一个应用", "一键把所有服务器加入应用", "她的服务器就在同一页"],
      };
      Film.run({
        duration: DURATION,
        tracks: ["link-admin", "link-phone"],
        build(lang, tr, { fit, timeOf }) {
          const A = tr["link-admin"];
          const P = tr["link-phone"];
          const m = A.marks;
          const r = A.rects;
          const pm = P.marks;
          // the edit: [from frame, to frame, speed]
          const plan = [
            [0, m.form, 1.3],
            [m.form, m.added, 1.5],
            [m.added, m.link, 1.4],
            [m.link, m.open + 12, 1.0],
          ];
          let at = 0;
          const admin = plan.map(([from, to, speed]) => {
            const s = { at, from, to, speed };
            at += (to - from) / 30 / speed;
            return s;
          });
          const T = (f) => timeOf(admin, f);
          // carol's phone rises in front of the dimmed admin; its footage plays a little faster than life
          const tP = at + 0.2;
          const phoneSeg = [{ at: tP, from: 0, to: P.frames.length - 1, speed: 1.4 }];
          const TP = (f) => timeOf(phoneSeg, f);
          const tEnd = TP(P.frames.length - 1) - 0.2;
          const phoneAt = { x: 1100, y: 96, w: P.viewport.width, h: P.viewport.height };
          const tIn = tP - 0.75;
          const box = (x, y, w, h) => ({ x, y, w, h });
          const key = (t, f, d) => ({ t, d, ...f });
          // the phone's upper part, where the page and its windows keep what is shown
          const phoneTop = fit(box(phoneAt.x - 10, phoneAt.y, phoneAt.w + 20, phoneAt.h * 0.62), 20);
          const c = captions[lang];
          return {
            loop: 0.5,
            outroAt: tEnd,
            windows: [
              { id: "admin", take: "link-admin", kind: "window", x: 0, y: 0, w: 1600, h: 1000, segments: admin, cursor: true, opacity: (t) => 1 - 1.0 * Film.inOut(Film.clamp((t - tIn) / 0.7)) },
              { id: "phone", take: "link-phone", kind: "phone", ...phoneAt, segments: phoneSeg, taps: true, opacity: (t) => (t >= tIn ? 1 : 0), lift: (t) => 1050 * (1 - Film.outCubic(Film.clamp((t - tIn) / 0.85))) },
            ],
            camera: [
              key(0, { cx: 800, cy: 500, vw: 2000 }, 0),
              key(0.1, fit(box(304, 90, 1240, 460), 30), 1.0),
              key(T(m.form) - 0.45, fit(r.dlgForm, 40), 0.55),
              key(T(m.added) - 0.35, fit(r.dlgAdded, 90), 0.55),
              key(T(m.link) - 0.35, fit(r.dlgLink, 40), 0.55),
              key(tP - 1.0, { cx: 800, cy: 520, vw: 1990 }, 0.9),
              key(tP + 0.1, phoneTop, 0.9),
            ],
            captions: [
              { at: T(m.form) - 0.1, end: T(m.added) - 0.6, text: c[0] },
              { at: T(m.added) - 0.2, end: tP - 0.6, text: c[1] },
              { at: tP + 0.2, end: TP(pm.add) - 0.3, text: c[2] },
              { at: TP(pm.add) - 0.1, end: TP(pm.connect) - 0.5, text: c[3] },
              { at: TP(pm.connect) - 0.3, end: TP(pm.servers) - 0.5, text: c[4] },
              { at: TP(pm.servers) - 0.3, end: tEnd - 0.1, text: c[5] },
            ],
          };
        },
      });
    </script>
  </body>
</html>
