# go tool buf generate  — regenerates Go (gen/) and TypeScript (web/src/gen/) from proto/.
version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/mistgate/mistgate/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: gen
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es
    out: web/src/gen
    opt: target=ts
