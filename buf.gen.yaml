# go tool buf generate  — regenerates Go (gen/) and TypeScript (web/src/gen/) from proto/.
version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/mistgate/mistgate/gen
# Pinned to the runtimes in go.mod and web/package.json: an unpinned plugin follows its latest major (connect-go v2
# rewrote every *.connect.go against a module this repo does not use). Bump together with the runtime.
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.21.0
    out: gen
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.16.0
    out: web/src/gen
    opt: target=ts
