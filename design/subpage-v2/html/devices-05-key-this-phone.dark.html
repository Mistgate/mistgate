<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ключ устройства · телефон · тёмная</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../mg-sub.css">
<style>body{margin:0;background:#0c0c0e}</style>
</head>
<body>
<div class="mg phone screen t-dark a-lavender">

  <div class="stack g12" aria-hidden="true">
    <header class="hd">
      <img class="logo" src="../assets/badge-lavender.svg" alt="" width="32" height="32">
      <div class="wm">mist<b>gate</b></div>
      <div class="lang"><button class="on">RU</button><button>EN</button></div>
    </header>
    <div class="sec-h" style="padding-top:4px"><h2 class="h2">Мои устройства</h2></div>
    <section class="card">
      <div class="dev"><div class="dev-top"><span class="tile s36 sky"></span><div class="dev-b"><p class="dev-n">Приложения по ссылке</p><p class="dev-m">в сети</p></div></div></div>
    </section>
  </div>
  <div class="scrim"></div>

  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="k-t" style="gap:20px;padding-bottom:22px">
    <div class="grab"></div>
    <div class="sh-head">
      <span class="tile mint"><svg class="i s20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4"/><path d="m10.4 12.6 9.1-9.1"/><path d="m16 6 3 3"/><path d="m13.8 8.2 2 2"/></svg></span>
      <div class="grow"><h3 id="k-t">Ключ для «iPhone»</h3><p class="sub">Устройство уже в списке — ключ можно показать снова</p></div>
      <button class="ibtn round" aria-label="Закрыть"><svg class="i s16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>

    <div class="seg" role="radiogroup" aria-label="Куда добавить">
      <button class="on" role="radio" aria-checked="true">Этот телефон</button>
      <button role="radio" aria-checked="false">Другое устройство</button>
    </div>

    <div class="fld">
      <label id="k-c">Страна</label>
      <button class="pick" aria-labelledby="k-c" aria-haspopup="listbox" style="min-height:52px">
        <span class="t grow"><span class="flag de" style="width:20px;height:14px"></span>Германия</span>
        <span class="hint">ещё 1</span>
        <svg class="i s16 chev" viewBox="0 0 24 24" aria-hidden="true" style="margin-left:0"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>

    <button class="btn pri"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 9V6.5A2.5 2.5 0 0 0 12.5 4h-6A2.5 2.5 0 0 0 4 6.5v6A2.5 2.5 0 0 0 6.5 15H9"/></svg>Скопировать ключ</button>

    <ol class="steps-box" aria-label="Дальше в AmneziaVPN">
      <li><span class="n">1</span><span>Откройте AmneziaVPN</span></li>
      <li><span class="n">2</span><span>Нажмите <span class="q">«+»</span> и вставьте ключ</span></li>
      <li><span class="n">3</span><span>Нажмите <span class="q">«Продолжить»</span></span></li>
    </ol>

    <p class="meta"><svg class="i s14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5.5c0 4.4 3 8.2 7 9.5 4-1.3 7-5.1 7-9.5V6z"/></svg>Ключ личный — не пересылайте его<br>Нужна AmneziaVPN 5.0.1.5 или новее</p>
  </section>

</div>
</body>
</html>
