<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новое устройство · телефон · тёмная</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../mg-sub.css">
<style>body{margin:0;background:#0c0c0e}</style>
</head>
<body>
<div class="mg phone screen t-dark a-lavender">

  <div class="stack g12" aria-hidden="true">
    <header class="hd">
      <img class="logo" src="../assets/badge-lavender.svg" alt="" width="32" height="32">
      <div class="wm">mist<b>gate</b></div>
      <div class="lang"><button class="on">RU</button><button>EN</button></div>
    </header>
    <div class="sec-h" style="padding-top:4px"><h2 class="h2">Мои устройства</h2></div>
    <section class="card">
      <div class="dev"><div class="dev-top"><span class="tile s36 sky"></span><div class="dev-b"><p class="dev-n">Приложения по ссылке</p><p class="dev-m">в сети</p></div></div></div>
      <div class="dev"><div class="dev-top"><span class="tile s36 mint"></span><div class="dev-b"><p class="dev-n">Pixel 7</p><p class="dev-m">Android · в сети</p></div></div></div>
    </section>
  </div>
  <div class="scrim"></div>

  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="nd-t" style="gap:20px;padding-bottom:24px">
    <div class="grab"></div>
    <div class="sh-head">
      <span class="tile mint"><svg class="i s20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
      <div class="grow"><h3 id="nd-t">Новое устройство</h3><p class="sub">Для него появится свой ключ AmneziaVPN</p></div>
      <button class="ibtn round" aria-label="Закрыть"><svg class="i s16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>

    <div class="fld">
      <label id="nd-p">Что за устройство</label>
      <div class="plats six compact" role="radiogroup" aria-labelledby="nd-p">
        <button class="plat on" role="radio" aria-checked="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="3.2"/><path d="M10.4 5.6h3.2"/></svg>iPhone</button>
        <button class="plat" role="radio" aria-checked="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2"/><path d="M12 5.6h.01"/><path d="M10 18.6h4"/></svg>Android</button>
        <button class="plat" role="radio" aria-checked="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/></svg>Windows</button>
        <button class="plat" role="radio" aria-checked="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15.5v-9A1.5 1.5 0 0 1 6.5 5h11A1.5 1.5 0 0 1 19 6.5v9"/><path d="M2.5 15.5h19l-.9 2.1a1.5 1.5 0 0 1-1.4.9H4.8a1.5 1.5 0 0 1-1.4-.9z"/></svg>Mac</button>
        <button class="plat" role="radio" aria-checked="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="m7.5 10 2.5 2.5-2.5 2.5M12.5 15.5h4"/></svg>Linux</button>
        <button class="plat" role="radio" aria-checked="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12h.01M12 12h.01M16 12h.01" style="stroke-width:3"/></svg>Другое</button>
      </div>
    </div>

    <div class="fld">
      <div class="fl-h"><label for="nd-n">Название</label><span class="hint">необязательно</span></div>
      <input id="nd-n" class="inp" placeholder="Например, телефон мамы" maxlength="40">
    </div>

    <div class="fld">
      <label id="nd-v">Вариант подключения</label>
      <button class="pick" aria-labelledby="nd-v" aria-haspopup="listbox">
        <span class="stack g4 grow">
          <span class="t"><span class="flag de" style="width:20px;height:14px"></span><span class="flag fi" style="width:20px;height:14px"></span>Германия, Финляндия</span>
          <span class="s">Обычное — подходит почти всегда</span>
        </span>
        <svg class="i s16 chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>

    <button class="btn pri">Создать ключ</button>
  </section>

</div>
</body>
</html>
