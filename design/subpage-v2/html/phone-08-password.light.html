<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Телефон · экран пароля · светлая</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../mg-sub.css">
<style>body{margin:0;background:#f8f8f6}</style>
</head>
<body>
<div class="mg phone screen t-light a-lavender">

  <header class="hd">
    <img class="logo" src="../assets/badge-lavender.svg" alt="" width="32" height="32">
    <div class="wm">mist<b>gate</b></div>
    <div class="lang" role="group" aria-label="Язык">
      <button class="on" aria-pressed="true">RU</button>
      <button aria-pressed="false">EN</button>
    </div>
  </header>

  <div class="stack" style="flex:1;justify-content:center;padding-bottom:72px">
    <section class="card stack g20" style="padding:30px 22px 22px" aria-labelledby="pw-t">
      <div style="position:relative;width:72px;height:72px;margin:0 auto">
        <img src="../assets/badge-lavender.svg" alt="" width="72" height="72" style="display:block">
        <span style="position:absolute;right:-6px;bottom:-4px;width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:3px solid var(--surface);display:grid;place-items:center;color:var(--text)"><svg class="i s14" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></span>
      </div>
      <div class="stack g8" style="text-align:center">
        <h1 class="h1" id="pw-t" style="font-size:24px">Введите пароль</h1>
        <p class="txt mut">Его прислали вместе со ссылкой. Спросим один раз — в этом браузере запомним.</p>
      </div>
      <div class="fld">
        <label for="pw">Пароль</label>
        <input id="pw" class="inp pw" placeholder="xxxx-xxxx" autocomplete="off" autocapitalize="none" spellcheck="false">
      </div>
      <button class="btn pri">Открыть</button>
      <p class="hint" style="text-align:center">Нет пароля? Спросите у того, кто прислал ссылку.</p>
    </section>
  </div>

</div>
</body>
</html>
