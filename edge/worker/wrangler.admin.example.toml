# Generated from internal/release.NewEdgeConfig (go generate ./internal/release). Do not edit: change the config and generate again.
# Copy to wrangler.admin.toml (or let scripts/build-edge.ps1 make the .dev.toml) and replace the database id; it holds no
# account id and no secret. Script mistgate-edge-admin: the admin SPA and API, sign-in and the first-run setup; the only role that creates the instance.
name = "mistgate-edge-admin"
main = "src/roles/admin.ts"
compatibility_date = "2026-10-01"
workers_dev = false

# The Go panel of this role (dist/admin.wasm) is imported by src/roles/admin.ts as a precompiled WebAssembly module.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "mistgate"
database_id = "replace-with-your-d1-database-id"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"
script_name = "mistgate-edge"

[[durable_objects.bindings]]
name = "NODELINK"
class_name = "NodeLink"
script_name = "mistgate-edge"

[[durable_objects.bindings]]
name = "PROVISIONER"
class_name = "Provisioner"
script_name = "mistgate-edge-provision"

# Every request goes to the Worker first and the panel reads these files through the ASSETS binding; only an exact file path is a hit.
[assets]
directory = "../../web/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[observability]
enabled = false

# Secrets, never a value in this file: wrangler secret put <NAME> --name mistgate-edge-admin. Locally put NAME=value lines in the git-ignored
# .dev.vars. MASTER_KEY is 32 random bytes as 64 hex characters, the same in every script that has it.
#   MASTER_KEY, ADMIN_PREFIX, SUB_PREFIX, SETUP_TOKEN_SHA256
# Optional secret RECOVERY_TOKEN_SHA256 is set separately by `mistgate edge reset-login`.

# Optional first-run settings, read only while the database is empty (afterwards the database wins):
# [vars]
# PUBLIC_URL = "..."
# ADMIN_HOST = "..."
