# Template for the Mistgate edge Worker. Copy to wrangler.toml and fill the placeholders; it holds no account id and no secret.
# Build first (scripts/build-edge.ps1): it produces dist/panel.wasm and dist/wasm_exec.js and builds web/dist.
name = "mistgate-edge"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

# The Go panel is imported by src/panel.ts as a precompiled WebAssembly module.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

# The panel's database. The panel creates and migrates its own tables on the first request.
[[d1_databases]]
binding = "DB"
database_name = "mistgate"
database_id = "replace-with-your-d1-database-id"

# The panel's security limits (login bursts, page-password tries, enrollment failures) live in one small Durable Object
# per (name, key): Worker isolates share no memory, so the count has to be somewhere they all reach. SQLite-backed;
# idle objects delete their own state and cost nothing.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

# The agent link of each node (internal/agentlink) lives in one Durable Object per node: it holds the agent's WebSocket
# and the session state, and the Go panel runs every step through the PanelLink entrypoint (src/panellink.ts, reached by
# ctx.exports, so there is nothing to bind). SQLite-backed; an idle object holds no timer and hibernates.
[[durable_objects.bindings]]
name = "NODELINK"
class_name = "NodeLink"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["NodeLink"]

# The admin SPA and the user page (web/dist) are NOT served by Cloudflare itself: every request goes to the Worker
# first (run_worker_first), and the panel reads these files through the ASSETS binding. html_handling and
# not_found_handling are off so that only an exact file path is a hit.
[assets]
directory = "../../web/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[observability]
enabled = false

# Required secret, never a value in this file: 32 random bytes as 64 hex characters.
#   openssl rand -hex 32 | wrangler secret put MASTER_KEY
# Locally, put MASTER_KEY=<64 hex> in the git-ignored .dev.vars. Losing this key makes everything the panel encrypted in
# D1 unreadable, so keep a copy in a password manager.
#
# Optional first-run settings (they are read only while the database is empty; afterwards the database wins). Without
# PUBLIC_URL the panel takes the origin of the very first request, which is wrong if that was the *.workers.dev name.
# [vars]
# PUBLIC_URL = "https://panel.example.com"
# ADMIN_HOST = "admin.example.com"   # admin on its own host instead of a secret path
# ADMIN_PREFIX = "/some-secret/"     # fixes the secret admin path (default: random, shown in the one-time setup link)
# SUB_PREFIX = "/another-secret/"    # fixes the subscription path (default: random)