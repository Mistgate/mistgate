# Generated from internal/release.NewEdgeConfig (go generate ./internal/release). Do not edit: change the config and generate again.
# Copy to wrangler.provision.toml (or let scripts/build-edge.ps1 make the .dev.toml) and replace the database id; it holds no
# account id and no secret. Script mistgate-edge-provision: the Provisioner Durable Object: SSH installs of nodes. A TCP socket belongs to the I/O context it was opened in, so Go serves only this object.
name = "mistgate-edge-provision"
main = "src/roles/provision.ts"
compatibility_date = "2026-10-01"
workers_dev = false

# The Go panel of this role (dist/provision.wasm) is imported by src/roles/provision.ts as a precompiled WebAssembly module.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "mistgate"
database_id = "replace-with-your-d1-database-id"

[[durable_objects.bindings]]
name = "PROVISIONER"
class_name = "Provisioner"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"
script_name = "mistgate-edge"

[[durable_objects.bindings]]
name = "NODELINK"
class_name = "NodeLink"
script_name = "mistgate-edge"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Provisioner"]

[observability]
enabled = false

# Secrets, never a value in this file: wrangler secret put <NAME> --name mistgate-edge-provision. Locally put NAME=value lines in the git-ignored
# .dev.vars. MASTER_KEY is 32 random bytes as 64 hex characters, the same in every script that has it.
#   MASTER_KEY
