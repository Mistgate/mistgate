# 3x-ui v3.9.0: the project's docker-compose.yml, with three changes: the published image instead of `build:`,
# ports bound to 127.0.0.1 (isolation), and cgroup_parent (the shared 1 vCPU / 1 GB budget).
services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:v3.9.0
    container_name: bench_3xui
    cgroup_parent: bench-panel.slice
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ${BENCH_ROOT:-/root/bench}/data/3xui/db/:/etc/x-ui/
      - ${BENCH_ROOT:-/root/bench}/data/3xui/cert/:/root/cert/
      - ${BENCH_ROOT:-/root/bench}/data/3xui/acme/:/root/.acme.sh/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
    tty: true
    ports:
      - "127.0.0.1:2053:2053"
      - "127.0.0.1:2096:2096"
    restart: "no"
