# Remnawave 3.4.5 one-server scenario: the official docker-compose-prod.yml stack (backend, Postgres 18.4, Valkey 9) plus the official
# node image (remnawave/node 3.4.2, Xray core inside), all in the one 2 vCPU / 2 GB slice (cgroup_parent on every service).
# The backend and the node sit on the isolated bench-box network with fixed addresses; Postgres and Valkey stay on the stack's own network.
x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: "no"
  cgroup_parent: bench-box.slice

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

x-env: &env
  env_file: ${BENCH_ROOT:-/root/bench}/remna/.env

services:
  remnawave:
    image: remnawave/backend:3.4.5
    container_name: remnawave
    hostname: remnawave
    <<: [*common, *logging, *env]
    volumes:
      - valkey-socket:/var/run/valkey
    networks:
      remnawave-network: {}
      bench-box:
        ipv4_address: 11.11.0.30
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:${METRICS_PORT:-3001}/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      remnawave-db:
        condition: service_healthy
      remnawave-redis:
        condition: service_healthy

  remnawave-db:
    image: postgres:18.4
    container_name: remnawave-db
    hostname: remnawave-db
    shm_size: 512mb
    <<: [*common, *logging, *env]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=UTC
    networks:
      - remnawave-network
    volumes:
      - remnawave-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 10s
      retries: 3

  remnawave-redis:
    image: valkey/valkey:9-alpine
    container_name: remnawave-redis
    hostname: remnawave-redis
    <<: [*common, *logging]
    networks:
      - remnawave-network
    volumes:
      - valkey-socket:/var/run/valkey
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory-policy noeviction
      --loglevel warning
      --unixsocket /var/run/valkey/valkey.sock
      --unixsocketperm 777
      --port 0
    healthcheck:
      test: ['CMD', 'valkey-cli', '-s', '/var/run/valkey/valkey.sock', 'ping']
      interval: 3s
      timeout: 3s
      retries: 3

  remnanode:
    image: remnawave/node:3.4.2
    container_name: remnanode
    hostname: remnanode
    <<: [*common, *logging]
    cap_add:
      - NET_ADMIN
    environment:
      - NODE_PORT=2222
      - SECRET_KEY=${NODE_SECRET_KEY}
    volumes:
      - ${BENCH_ROOT:-/root/bench}/data/box-rw/cert:/certs:ro
    networks:
      bench-box:
        ipv4_address: 11.11.0.31

networks:
  remnawave-network:
    name: remnawave-network
    driver: bridge
    external: false
  bench-box:
    external: true

volumes:
  remnawave-db-data:
    name: remnawave-db-data
    driver: local
    external: false
  valkey-socket:
    name: valkey-socket
    driver: local
    external: false
