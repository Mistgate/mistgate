# Router: transparent proxy for the LAN. The panel puts the servers in `proxies` and adds `Auto`.
mixed-port: 7890
redir-port: 7892
tproxy-port: 7893
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
external-controller: 127.0.0.1:9090
x-check: &check
  url: https://www.gstatic.com/generate_204
  interval: 300
proxy-groups:
  - name: Proxy
    type: select
    include-all-proxies: true
    proxies: [Auto, DIRECT] # the panel's Auto group
  - name: Fast
    <<: *check
    type: url-test
    include-all-proxies: true
    filter: "(?i)de|nl"
  - name: "Auto"
    type: url-test
    proxies:
      - "\U0001F1E9\U0001F1EA de1 · hy2"
      - "\U0001F1F3\U0001F1F1 nl1 · awg"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true
    timeout: 5000
rule-providers:
  ads:
    type: http
    behavior: domain
    format: mrs
    url: https://example.com/ads.mrs
    interval: 86400
rules:
  - RULE-SET,ads,REJECT
  - DOMAIN-SUFFIX,example.com,DIRECT
  - GEOIP,LAN,DIRECT,no-resolve
  - MATCH,Proxy
proxies:
  - name: "\U0001F1E9\U0001F1EA de1 · hy2"
    type: hysteria2
    server: "de2.example.com"
    port: 443
    password: "tok-DEVICE_secret_0123456789abcdefghijklmn"
    obfs: salamander
    obfs-password: "gawrgura-pw"
    sni: "de1.example.com"
    skip-cert-verify: false
    alpn: [h3]
  - name: "\U0001F1F3\U0001F1F1 nl1 · awg"
    type: wireguard
    server: "203.0.113.10"
    port: 51842
    ip: "10.66.4.5/32"
    ipv6: "fd66:66:0:1::5/128"
    private-key: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="
    public-key: "wMHCw8TFxsfIycrLzM3Oz9DR0tPU1dbX2Nna29zd3t8="
    pre-shared-key: "gIGCg4SFhoeIiYqLjI2Oj5CRkpOUlZaXmJmam5ydnp8="
    allowed-ips:
      - "0.0.0.0/0"
      - "::/0"
    udp: true
    mtu: 1280
    persistent-keepalive: 25
    remote-dns-resolve: true
    dns:
      - "1.1.1.1"
      - "8.8.8.8"
    amnezia-wg-option:
      version: 3
      jc: 6
      jmin: 10
      jmax: 50
      s1: 24
      s2: 24
      s3: 24
      s4: 24
      h1: "1"
      h2: "2"
      h3: "3"
      h4: "4"
      i1: "<r 2><b 0x858000010001000000000669636c6f756403636f6d0000010001c00c000100010000105a00044d583737>"
      header-protection-key: "QEFCQ0RFRkdISUpLTE1OT1BRUlNUVVZXWFlaW1xdXl8="
      content-padding-addition: "2-10"
      rekey-after-time: "100-120"
      rekey-timeout: "3-7"
      reject-after-time: "150-180"
      keepalive-timeout: "5-15"
      max-handshake-attempts: "15-20"
      random-trailers: true
      disable-cookies: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - "1.1.1.1"
    - "8.8.8.8"
    - "1.0.0.1"
    - "8.8.4.4"
  proxy-server-nameserver:
    - "1.1.1.1"
    - "8.8.8.8"
    - "1.0.0.1"
    - "8.8.4.4"
  respect-rules: true
