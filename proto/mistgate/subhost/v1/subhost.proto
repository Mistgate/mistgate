syntax = "proto3";

package mistgate.subhost.v1;

// SubscriptionHostService puts the panel's public address on a subdomain served by one node, the subscription host: people's
// subscriptions and the agents' link reach the panel through that node, which hands their TLS to the panel over the bridge the
// panel dials (design/adr/0018-panel-behind-nat.md). The panel then needs no public address of its own.
//
// A separate package from mistgate.admin.v1 on purpose, like mistgate.trusttunnel.v1: the Cloudflare edition's Workers link every
// admin message, and the subscription host is not offered there. Every procedure is the owner's; the changing ones need a fresh
// step-up (internal/panel/auth/policy_subhost.go). Refusals are coded ("err.<code>" in the admin UI, see web/src/lib/errors.ts):
// sub_host_wrong_state, sub_host_domain_invalid, sub_host_site_name_invalid, sub_host_node_unfit (reason=retired|offline|
// agent_too_old|reality_foreign_target|hysteria2_site_443|port_443_unshareable|name_taken|site_name_required|site_name_conflict),
// sub_host_nodes_lack_link (nodes=<ids>), sub_host_dns_mismatch (found, expected), sub_host_return_url_required,
// sub_host_nodes_pending (nodes=<ids>), sub_host_same_node.
service SubscriptionHostService {
  rpc GetSubscriptionHost(GetSubscriptionHostRequest) returns (GetSubscriptionHostResponse);
  // off -> on: the node becomes the host; the panel moves to the subdomain once the host is ready.
  rpc SetSubscriptionHost(SetSubscriptionHostRequest) returns (SetSubscriptionHostResponse);
  // on -> moving: a second node gets ready to take over.
  rpc StartSubscriptionHostMove(StartSubscriptionHostMoveRequest) returns (StartSubscriptionHostMoveResponse);
  // moving -> on (the next node takes over), leaving -> off.
  rpc FinishSubscriptionHostChange(FinishSubscriptionHostChangeRequest) returns (FinishSubscriptionHostChangeResponse);
  // moving -> on (the move is dropped), leaving -> on.
  rpc CancelSubscriptionHostChange(CancelSubscriptionHostChangeRequest) returns (CancelSubscriptionHostChangeResponse);
  // on -> leaving: the panel goes back to public_url.
  rpc DisableSubscriptionHost(DisableSubscriptionHostRequest) returns (DisableSubscriptionHostResponse);
  // Read-only: whether the domain's (and the site name's) DNS points at the node.
  rpc CheckSubscriptionHostDomain(CheckSubscriptionHostDomainRequest) returns (CheckSubscriptionHostDomainResponse);
}

enum SubscriptionHostState {
  SUBSCRIPTION_HOST_STATE_UNSPECIFIED = 0;
  SUBSCRIPTION_HOST_STATE_OFF = 1;
  SUBSCRIPTION_HOST_STATE_ON = 2;
  SUBSCRIPTION_HOST_STATE_MOVING = 3;
  SUBSCRIPTION_HOST_STATE_LEAVING = 4;
}

// The panel's connection to one host node (the bridge it dials).
message SubscriptionHostBridge {
  string node_id = 1;
  bool up = 2;
  // When it last went up or down.
  int64 since_unix = 3 [jstype = JS_NUMBER];
  uint32 rtt_ms = 4;
  // Why it is down: "" (up or unknown) | unreachable | tls | pin_mismatch | refused | no_verification | unfit:<reason>.
  string down_reason = 5;
}

// An online node still connected through the subscription host while it is being turned off.
message SubscriptionHostPendingNode {
  string node_id = 1;
  string name = 2;
}

message SubscriptionHostNodeRef {
  string node_id = 1;
  string name = 2;
}

message SubscriptionHost {
  SubscriptionHostState state = 1;
  string domain = 2;
  string node_id = 3;
  string next_node_id = 4;
  // The panel's effective public address.
  string public_url = 5;
  repeated SubscriptionHostBridge bridges = 6;
  repeated SubscriptionHostPendingNode pending = 7;
  // The CAA record that limits certificates for the domain to this panel's ACME account, and whether DNS has it:
  // account_pending | present | absent | unknown.
  string caa_record = 8;
  string caa_status = 9;
  // Nodes whose agent cannot follow the panel to a new link address (no ws-link/1 or panel-link/1).
  repeated SubscriptionHostNodeRef lacking_link = 10;
  // The name of the host's own site on 443 (when no inbound there serves one); empty otherwise.
  string site_name = 11;
  // The host is ready: the panel's subscriptions and agents use the subdomain. Until then not_ready says what is missing:
  // host_offline | host_error | site_cert (the host's site has no public certificate yet) | bridge (the panel holds no
  // connection) | panel_cert (the panel has no certificate for the subdomain yet).
  bool ready = 12;
  repeated string not_ready = 13;
}

message GetSubscriptionHostRequest {}

message GetSubscriptionHostResponse {
  SubscriptionHost host = 1;
}

message SetSubscriptionHostRequest {
  string node_id = 1;
  string domain = 2;
  bool skip_dns_check = 3;
  // Needed when no inbound on the node's 443 serves its own site.
  string site_name = 4;
}

message SetSubscriptionHostResponse {
  SubscriptionHost host = 1;
}

message StartSubscriptionHostMoveRequest {
  string node_id = 1;
  string site_name = 2;
}

message StartSubscriptionHostMoveResponse {
  SubscriptionHost host = 1;
}

message FinishSubscriptionHostChangeRequest {
  // Finish even while nodes are still connected through the subscription host (leaving), or the DNS does not point at the
  // next node yet (moving).
  bool force = 1;
}

message FinishSubscriptionHostChangeResponse {
  SubscriptionHost host = 1;
}

message CancelSubscriptionHostChangeRequest {}

message CancelSubscriptionHostChangeResponse {
  SubscriptionHost host = 1;
}

message DisableSubscriptionHostRequest {
  // https://host[:port], or empty with force when the panel will have no public address.
  string public_url = 1;
  bool force = 2;
}

message DisableSubscriptionHostResponse {
  SubscriptionHost host = 1;
}

message CheckSubscriptionHostDomainRequest {
  string node_id = 1;
  string domain = 2;
  string site_name = 3;
}

message CheckSubscriptionHostDomainResponse {
  bool matches = 1;
  repeated string found = 2;
  repeated string expected = 3;
}
