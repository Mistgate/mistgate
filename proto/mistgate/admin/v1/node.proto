syntax = "proto3";

package mistgate.admin.v1;

import "mistgate/admin/v1/common.proto";
import "mistgate/admin/v1/fleet.proto";

// Nodes screen, node detail screen, and adding a node by running an install command.
// SSH provisioning (wizard, pre-checks, install log, uninstall) is not here yet and will get its own service.
service NodeService {
  // All nodes. The fleet is at most ~50 nodes, so no pagination; filtering by country, status and
  // protocol is done in the SPA.
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  // Creates the node row (PENDING) and a one-time enrollment token; returns the command to run on the
  // server. Passing node_id re-enrolls an existing node (lost certificate, reinstall).
  rpc CreateEnrollment(CreateEnrollmentRequest) returns (CreateEnrollmentResponse);
  rpc UpdateNode(UpdateNodeRequest) returns (UpdateNodeResponse);
  // Select the node's decoy site: "builtin", "panel" or "own" (an own bundle must already be uploaded).
  rpc SetNodeDecoyMode(SetNodeDecoyModeRequest) returns (SetNodeDecoyModeResponse);
  // Upload one ZIP or TAR static site for this node (2 MiB maximum); this also selects "own".
  rpc UploadNodeDecoy(UploadNodeDecoyRequest) returns (UploadNodeDecoyResponse);
  // Select one mode for up to 50 nodes. "own" requires each node to have its own uploaded bundle.
  rpc SetNodesDecoyMode(SetNodesDecoyModeRequest) returns (SetNodesDecoyModeResponse);
  // Restart one inbound or all inbounds of a node ("Restart profiles" button). Drops its sessions.
  rpc RestartInbounds(RestartInboundsRequest) returns (RestartInboundsResponse);
  // The node's AmneziaWG kernel module (agents with "awg-prepare/1"). confirm = false only asks the node whether the
  // module is ready or can be built there (nothing changes); confirm = true starts building it in the background. The
  // node keeps its current backend meanwhile; when the module is built and loaded the panel switches the node to
  // awg_backend "kernel" (unless the admin chose another backend in the meantime). Fails with FAILED_PRECONDITION
  // "agent too old" / "the node is not connected".
  rpc PrepareAwgKernel(PrepareAwgKernelRequest) returns (PrepareAwgKernelResponse);
  // Asks the connected agent (capability "bandwidth/1") to measure how fast the node reaches the internet: three runs, about 30 seconds,
  // up to 1.5 GB through a public speed server (the nearest Ookla one, else Cloudflare and others), the best run counts, and the traffic of the people already using the node during the test is part of the result. It only returns the result; it never changes bandwidth_mbps (the admin
  // chooses to use it). Owner only, closed to API tokens and MCP: it makes the node push traffic. Fails with
  // FAILED_PRECONDITION "node_offline" / "agent too old"; an answer the node itself gave (busy, no server reachable...) is
  // in error_code. One measurement per node at a time.
  rpc MeasureBandwidth(MeasureBandwidthRequest) returns (MeasureBandwidthResponse);
  // Checks that UDP datagrams sent to the node arrive (agents with "udpcheck/1"; design/udp-port-check.md): about 6 s per
  // 8 ports, a few MB. Ports: the given ones (at most 7), else the node's enabled inbound ports and the free ports the
  // picker prefers; 443 is always added. Another node sends (both editions); a VPS panel with no other usable node sends
  // itself. Conclusive results are stored and shown in GetNodeResponse.port_checks.
  // The same call probes the node's TCP ports (agents with "tcpcheck/1"; design/vless.md section 7.4): port 80 only with an
  // ACME name on the node, the Hysteria2 site port and the VLESS ports. The rows are CheckPortsResponse.tcp and are stored for
  // GetNodeResponse.tcp_checks. Owner or helper; API tokens directly (like RunDoctor). Every "could not check" outcome is error_code, never an RPC error.
  rpc CheckPorts(CheckPortsRequest) returns (CheckPortsResponse);
  // "Retire from fleet": revoke the certificate, tell a connected agent to exit, remove the node from
  // every user's access. The row stays (audit, traffic history) with status RETIRED.
  rpc RetireNode(RetireNodeRequest) returns (RetireNodeResponse);
  // Live log tail of the agent and its engines, relayed from the node. Ends with eof = true, on client
  // cancel, or when the node link drops (then the last chunk has error set).
  rpc StreamLogs(StreamLogsRequest) returns (stream StreamLogsResponse);
  // The connection counters of the node's inbounds over the last hours (agents with "links/1", agent.proto
  // LinkCounters): attempts, refusals, early drops, handshakes that do not complete, unknown keys. Counts only, no
  // address. A read: every role and API tokens (the MCP tool node_connections).
  rpc GetNodeConnections(GetNodeConnectionsRequest) returns (GetNodeConnectionsResponse);
  // The saved journal of the nodes' agents and engines (agents with "journal/1", agent.proto JournalEntry): their warnings
  // and errors, grouped per hour, kept 7 days. Addresses are cut on the node and again in the panel. A read: every role and
  // API tokens (the MCP tool node_journal); the live tail (StreamLogs) stays the owner's.
  rpc GetNodeJournal(GetNodeJournalRequest) returns (GetNodeJournalResponse);
  // GetNodeConnections of every node that is not retired, in one read (the MCP tool fleet_connections). A read: every role
  // and API tokens.
  rpc GetFleetConnections(GetFleetConnectionsRequest) returns (GetFleetConnectionsResponse);
}

// One row of the nodes table / one card.
message Node {
  string id = 1;
  // Short unique name shown everywhere: "de1".
  string name = 2;
  // ISO 3166-1 alpha-2, for the flag/code badge.
  string country_code = 3;
  // Free text shown next to the country: "Estonia", "Helsinki", "Moscow".
  string location = 4;
  string provider = 5;
  // Public host or IP that clients connect to; used in subscriptions.
  string address = 6;
  NodeStatus status = 7;
  StatusReason reason = 8;
  // Plugin ids of the protocols deployed here (from inbounds).
  repeated string protocols = 9;
  // People online now, per protocol.
  repeated ProtocolCount online = 10;
  // Bytes (up + down) since 00:00 UTC.
  uint64 traffic_today_bytes = 11 [jstype = JS_NUMBER];
  // Latest gauges; unset (has_metrics = false) while the node is down or pending.
  bool has_metrics = 12;
  float cpu_pct = 13;
  float ram_pct = 14;
  string agent_version = 15;
  // Host uptime from the agent; 0 when unknown.
  uint64 uptime_s = 16 [jstype = JS_NUMBER];
  // Last time anything was received from the agent.
  int64 last_seen_unix = 17 [jstype = JS_NUMBER];
  // AmneziaWG backend setting of the node: "auto" | "kernel" | "userspace" (what is running is in
  // Inbound.awg.backend).
  string awg_backend = 18;
  // WARP egress of this node; state NOT_CONFIGURED when it has no account.
  WarpSummary warp = 19;
  // Building the AmneziaWG kernel module on the node.
  AwgPrepare awg_prepare = 20;
  // Whether the node blocks recognized BitTorrent traffic.
  bool torrent_blocker_enabled = 21;
  // The connected or last-seen agent lists "torrentguard/1".
  bool torrent_blocker_supported = 22;
  // Optional symmetric network capacity in Mbps; 0 means unknown and disables utilization percentages.
  uint32 bandwidth_mbps = 23;
  // "IPv6 for clients": true (the default) lets people leave the node over IPv6; false makes the node refuse client
  // IPv6 that would leave through its own uplink, so apps fall back to IPv4 at once.
  bool client_ipv6 = 24;
  // The connected or last-seen agent lists "client-ipv6/1", so it follows client_ipv6 = false.
  bool client_ipv6_supported = 25;
  // Configured mode, "builtin" | "panel" | "own". Existing nodes retain builtin unless changed by the owner.
  string decoy_mode = 26;
  // Whether the connected or last-seen agent lists "decoy/1".
  bool decoy_supported = 27;
  // Why the node is still serving builtin or has not applied its configured mode: empty when current.
  string decoy_reason_code = 28;
  // SHA-256 of the saved own bundle for this node; empty when none is uploaded.
  string decoy_bundle_sha256 = 29;
  // Whether this panel has a valid --decoy-dir bundle.
  bool decoy_panel_available = 30;
  // False in editions that do not store own bundles.
  bool decoy_own_available = 31;
  // Mode and SHA-256 last reported by the node agent.
  string decoy_agent_mode = 32;
  string decoy_agent_sha256 = 33;
  // The connected or last-seen agent lists "user-rate-limit/1", so it applies the per-person speed limit
  // (User.speed_limit_bps). False: this node holds people to the smaller of their two limits per device instead.
  bool user_rate_limit_supported = 34;
}

enum AwgPrepareState {
  // Nothing was asked of this node yet (or the last result was cleared).
  AWG_PREPARE_STATE_NONE = 0;
  // Building: since_unix is when it began.
  AWG_PREPARE_STATE_RUNNING = 1;
  // Built and loaded; since_unix is when it finished.
  AWG_PREPARE_STATE_DONE = 2;
  // Did not work; the node kept its backend. reason_code / reason say why, since_unix when.
  AWG_PREPARE_STATE_FAILED = 3;
}

// The automatic preparation of the kernel module, as the panel last learned it from the node.
message AwgPrepare {
  // The agent lists "awg-prepare/1" (live stream, else its last Hello): false = the UI shows the manual command.
  bool supported = 1;
  AwgPrepareState state = 2;
  int64 since_unix = 3 [jstype = JS_NUMBER];
  // FAILED: a stable code (timeout, apt_lock, step_failed, source_moved, module_not_loaded, module_unusable,
  // interrupted) and one short English sentence. Never package-manager output.
  string reason_code = 4;
  string reason = 5;
}

message ListNodesRequest {
  // Retired nodes are hidden unless asked for.
  bool include_retired = 1;
}

message ListNodesResponse {
  repeated Node nodes = 1;
  // Newest agent version this panel ships; the UI marks older agents "outdated agent".
  string expected_agent_version = 2;
}

message GetNodeRequest {
  string node_id = 1;
}

// Gauges for the Overview tab of the node (CPU incl. softirq, RAM, disk, network).
message NodeMetrics {
  float cpu_pct = 1;
  float softirq_pct = 2;
  float load1 = 3;
  uint64 ram_used_bytes = 4 [jstype = JS_NUMBER];
  uint64 ram_total_bytes = 5 [jstype = JS_NUMBER];
  uint64 disk_used_bytes = 6 [jstype = JS_NUMBER];
  uint64 disk_total_bytes = 7 [jstype = JS_NUMBER];
  // Bits per second, main NIC.
  uint64 net_rx_bps = 8 [jstype = JS_NUMBER];
  uint64 net_tx_bps = 9 [jstype = JS_NUMBER];
  int64 at_unix = 10 [jstype = JS_NUMBER];
}

// "Host facts" block. The full pre-check result comes with SSH provisioning.
message NodeFacts {
  string hostname = 1;
  string os = 2;
  string kernel = 3;
  string arch = 4;
  uint32 cpu_count = 5;
  uint64 ram_total_bytes = 6 [jstype = JS_NUMBER];
  uint64 disk_total_bytes = 7 [jstype = JS_NUMBER];
  string virt = 8;
  bool has_ipv6 = 9;
  int64 boot_unix = 10 [jstype = JS_NUMBER];
  // Engine versions, "hysteria2: hysteria core v2.12.3".
  repeated string engines = 11;
}

// Per-node tunables. Zero = default.
message NodeTimeouts {
  // Silence before the panel closes the agent stream. Default 90.
  uint32 liveness_timeout_s = 1;
  // Wait for a command result before marking it "no answer". Default 120.
  uint32 apply_timeout_s = 2;
  // Agent dial timeout. Default 15.
  uint32 dial_timeout_s = 3;
}

message OnlineUser {
  string user_id = 1;
  string user_name = 2;
  string protocol = 3;
  string device_model = 4;
  int64 connected_at_unix = 5 [jstype = JS_NUMBER];
  // Current download speed through this node, bits per second.
  uint64 down_bps = 6 [jstype = JS_NUMBER];
}

message TopUser {
  string user_id = 1;
  string user_name = 2;
  uint64 bytes = 3 [jstype = JS_NUMBER];
}

message GetNodeResponse {
  Node node = 1;
  // Unset while no metrics have arrived.
  NodeMetrics metrics = 2;
  NodeFacts facts = 3;
  repeated Inbound inbounds = 4;
  // "On this node now".
  repeated OnlineUser online_users = 5;
  // "Top today": by bytes since 00:00 UTC, at most 10.
  repeated TopUser top_today = 6;
  string notes = 7;
  repeated string dns_resolvers = 8;
  NodeTimeouts timeouts = 9;
  // PENDING nodes: when the enrollment token stops working.
  int64 enrollment_expires_unix = 10 [jstype = JS_NUMBER];
  int64 created_unix = 11 [jstype = JS_NUMBER];
  // Stored UDP delivery checks of this node's current address, by port.
  repeated PortCheck port_checks = 12;
  // Stored TCP checks of this node (the last run), by port.
  repeated TcpCheck tcp_checks = 13;
}

message CreateEnrollmentRequest {
  // Empty = create a new node. Set = re-enroll this node (its old certificate is revoked on success).
  string node_id = 1;
  // Required for a new node. [a-z0-9-]{2,24}, unique, case-insensitive.
  string name = 2;
  // Required for a new node: the public host or IP that clients will connect to.
  string address = 3;
  string country_code = 4;
  string location = 5;
  string provider = 6;
  // Token lifetime. 0 = 3600. Max 86400.
  uint32 ttl_seconds = 7;
}

message CreateEnrollmentResponse {
  Node node = 1;
  // The exact command to run as root on the server, one line: it runs the agent binary from /root/mistgate-node
  // (chmod, enroll, install; install copies it to /usr/local/bin), so nothing depends on PATH. It contains the one-time
  // token, so it is shown once and is not retrievable afterwards (create a new enrollment instead).
  string install_command = 2;
  // "sha256:" + hex, of the panel CA certificate. Shown separately so the admin can compare it with
  // what the command contains.
  string ca_fingerprint = 3;
  int64 expires_unix = 4 [jstype = JS_NUMBER];
  // A command to run on the panel's own server that puts the linux/amd64 agent binary of the trusted update bundle at
  // /root/mistgate-node on the node ("scp <data-dir>/dist/mistgate-node-linux-amd64 root@<address>:/root/mistgate-node").
  // Empty when the panel has no trusted bundle.
  string copy_command = 5;
}

message UpdateNodeRequest {
  string node_id = 1;
  optional string name = 2;
  optional string address = 3;
  optional string country_code = 4;
  optional string location = 5;
  optional string provider = 6;
  optional string notes = 7;
  // Presence = replace the whole list (empty list = use the agent default by geolocation).
  optional DnsResolvers dns_resolvers = 8;
  optional NodeTimeouts timeouts = 9;
  // "auto" | "kernel" | "userspace". Needs an agent with "awg/1" while the node has awg inbounds
  // (FAILED_PRECONDITION "agent too old" otherwise).
  optional string awg_backend = 10;
  // Requires an agent with "torrentguard/1" when true. Disabling is always allowed.
  optional bool torrent_blocker_enabled = 11;
  // Symmetric network capacity in Mbps. 0 disables utilization percentages; maximum 1,000,000.
  optional uint32 bandwidth_mbps = 12;
  // "IPv6 for clients". Owner only (PERMISSION_DENIED for a helper). Requires an agent with "client-ipv6/1" when false
  // (FAILED_PRECONDITION "agent too old" otherwise); turning it back on is always allowed.
  optional bool client_ipv6 = 13;
}

message DnsResolvers {
  repeated string values = 1;
}

message UpdateNodeResponse {
  Node node = 1;
}

message SetNodeDecoyModeRequest {
  string node_id = 1;
  string mode = 2;
  // Optional bundle when selecting "own"; empty reuses the saved bundle.
  bytes bundle_archive = 3;
}

message SetNodeDecoyModeResponse {
  Node node = 1;
}

message UploadNodeDecoyRequest {
  string node_id = 1;
  // ZIP or TAR archive containing only regular static files. Archive and total expanded files are each <= 2 MiB.
  bytes bundle_archive = 2;
}

message UploadNodeDecoyResponse {
  Node node = 1;
}

message SetNodesDecoyModeRequest {
  repeated string node_ids = 1;
  string mode = 2;
}

message SetNodesDecoyModeResponse {
  repeated Node nodes = 1;
}

message RestartInboundsRequest {
  string node_id = 1;
  // Empty = all inbounds of the node.
  string inbound_id = 2;
}

message RestartInboundsResponse {
  // Inbounds restarted. Fails with FAILED_PRECONDITION if the node is not connected.
  uint32 restarted = 1;
}

message PrepareAwgKernelRequest {
  string node_id = 1;
  // false: ask only (the answer is READY, NEEDS_PREPARE, RUNNING or UNSUPPORTED). true: start the build when the module is
  // not ready (answer STARTED, or RUNNING when one already runs, READY when there is nothing to do).
  bool confirm = 2;
}

enum PrepareAwgOutcome {
  PREPARE_AWG_OUTCOME_UNSPECIFIED = 0;
  // The module is loaded and usable: switching to it is just a setting.
  PREPARE_AWG_OUTCOME_READY = 1;
  // Not ready, and it can be built on this node (confirm = false).
  PREPARE_AWG_OUTCOME_NEEDS_PREPARE = 2;
  // The build began just now.
  PREPARE_AWG_OUTCOME_STARTED = 3;
  // A build is already going; nothing was started.
  PREPARE_AWG_OUTCOME_RUNNING = 4;
  // It cannot be built here (reason_code: container, distro, unknown_kernel, secure_boot, no_systemd, launch_failed).
  PREPARE_AWG_OUTCOME_UNSUPPORTED = 5;
}

message PrepareAwgKernelResponse {
  PrepareAwgOutcome outcome = 1;
  string reason_code = 2;
  string reason = 3;
  // The node as it is after the call (awg_prepare included).
  Node node = 4;
}

message MeasureBandwidthRequest {
  string node_id = 1;
}

message MeasureBandwidthResponse {
  // Mbps (megabits per second), measured from the node: what it downloaded from, and uploaded to, the test server. 0 up
  // = the upload could not be measured (the server did not take it). Both are 0 when error_code is set.
  uint32 down_mbps = 1;
  uint32 up_mbps = 2;
  // The test server that answered: "Ookla" (see server_detail), "speed.cloudflare.com", "proof.ovh.net" or "cachefly.net".
  string server = 3;
  // "" = measured. Otherwise what the node answered: busy (a measurement is already running), unreachable (no test server
  // gave a usable answer), unsupported, failed.
  string error_code = 4;
  // How long the whole measurement took, in seconds.
  uint32 seconds = 5;
  // The part of the best run's rate that the interface carried beyond the test: people already using the node (already
  // included in down_mbps / up_mbps). 0 = none, or the node's interface could not be read.
  uint32 people_down_mbps = 6;
  uint32 people_up_mbps = 7;
  // Runs that gave a result, of runs_total.
  uint32 runs = 8;
  // Runs the node was asked to do (3). 0 = the agent did not say (an older one): read it as equal to runs.
  uint32 runs_total = 9;
  // Why each run that did not work failed, in order: rate_limited, timeout, unreachable, http_<code> or failed. Empty when
  // every run worked, and for an agent that does not report it.
  repeated string run_failures = 10;
  // Which server of the provider answered: for Ookla, the sponsor and city ("MTS, Moscow"); "" for the others.
  string server_detail = 11;
}

message CheckPortsRequest {
  string node_id = 1;
  // At most 7; 443 is always added. Empty = the node's enabled inbound ports, then the free ports the picker prefers.
  repeated uint32 ports = 2;
}

message CheckPortsResponse {
  repeated PortCheck ports = 1;
  // "" = checked. Otherwise PortCheck.reason's words; same_host and inconclusive still carry the counts in ports.
  string error_code = 2;
  // "panel" or the name of the node that sent.
  string sender = 3;
  // The TCP half of the same run (design/vless.md section 7.4): port 80 when the node has an ACME name, the Hysteria2
  // site port, and the VLESS ports, at most 8, 80 first. Empty when the node has nothing to probe, is offline, or has no
  // sender for the TCP part (no other node lists "tcpcheck/1" and the panel does not send); the UDP part's error_code
  // does not decide it, except node_offline. A row that could not be probed has verdict "" and a reason.
  repeated TcpCheck tcp = 4;
}

message RetireNodeRequest {
  string node_id = 1;
  // The node name typed by the admin; must equal the current name.
  string confirm_name = 2;
}

message RetireNodeResponse {
  // false if the agent was offline; it cannot reconnect anyway (its certificate is revoked).
  bool agent_notified = 1;
}

message GetNodeConnectionsRequest {
  string node_id = 1;
  // Hours back from now, 1 to 168 (the retention). 0 means 24; more is cut to 168.
  uint32 hours = 2;
  // Also each inbound hour by hour (InboundConnections.hours).
  bool by_hour = 3;
}

message GetFleetConnectionsRequest {
  // Hours back from now, 1 to 168. 0 means 24; more is cut to 168.
  uint32 hours = 1;
}

// One node of GetFleetConnections: GetNodeConnections without hours and clients.
message NodeConnections {
  string node_id = 1;
  string node_name = 2;
  string country_code = 3;
  bool supported = 4;
  repeated InboundConnections inbounds = 5;
}

message GetFleetConnectionsResponse {
  int64 since_unix = 1 [jstype = JS_NUMBER];
  int64 now_unix = 2 [jstype = JS_NUMBER];
  // Every node that is not retired, by name.
  repeated NodeConnections nodes = 3;
}

message GetNodeJournalRequest {
  // "" = every node that is not retired.
  string node_id = 1;
  // Hours back from now, 1 to 168 (the retention). 0 means 24; more is cut to 168.
  uint32 hours = 2;
  // WARNING (also for UNSPECIFIED and INFO) or ERROR.
  EventSeverity min_level = 3;
  // "agent", "hysteria2", "vless", "awg", "xray", ... "" = all.
  string source = 4;
  // "" = all; else only this inbound's entries.
  string inbound_id = 5;
  // Case-insensitive substring of the message or of an attribute value; at most 100 characters. "" = all.
  string query = 6;
  // At most 200; 0 means 100.
  uint32 limit = 7;
}

// One kind of record of one node in one hour.
message NodeJournalEntry {
  string node_id = 1;
  string node_name = 2;
  int64 hour_start_unix = 3 [jstype = JS_NUMBER];
  // WARNING or ERROR.
  EventSeverity level = 4;
  string source = 5;
  // The template of the record, addresses replaced by "<ip>" or "<ip>:port".
  string message = 6;
  // "" when the record names no inbound.
  string inbound_id = 7;
  // The inbound's profile name; "" when there is no inbound or it was removed.
  string profile_name = 8;
  // The allow-listed attributes of the first record of the hour (agent.proto JournalEntry), cleaned like message.
  map<string, string> attrs = 9;
  uint32 count = 10;
  int64 first_unix = 11 [jstype = JS_NUMBER];
  int64 last_unix = 12 [jstype = JS_NUMBER];
}

message GetNodeJournalResponse {
  int64 since_unix = 1 [jstype = JS_NUMBER];
  int64 now_unix = 2 [jstype = JS_NUMBER];
  // Newest last_unix first, then node name.
  repeated NodeJournalEntry entries = 3;
  // More entries matched than limit.
  bool truncated = 4;
  // The nodes in scope (not retired) whose agent does not send the journal (it does not list "journal/1").
  repeated string nodes_without_journal = 5;
}

// One inbound of the node: its counters summed over its keys and its own row, in the window. What the counters can and
// cannot say (none of them is a block by itself):
//   - connects: accepted connections. Port hopping and short test connections make many for one person.
//   - rejects: a known key refused because its term ended.
//   - drops (Hysteria2): an idle timeout of a connection younger than 60 s or under 64 KiB. A TSPU freeze looks like this,
//     and so does a short test connection of an app (a server check, auto-select): only together with other signals.
//   - stalls (AmneziaWG): 10-second rounds in which the device's initiations reached the node and no handshake completed:
//     the node's answer does not reach the device, or the device cannot read it.
//   - online_s: seconds with an open session, including the idle tail of short sessions.
//   - unknown_keys: attempts with a key the node does not hold (scanners too, and removed or rotated keys).
//   - hellos, handshakes (Hysteria2): QUIC ClientHellos and the authentications that followed; hellos include scanners and
//     apps that ping with a handshake, and miss resumed TLS sessions.
// Hysteria2 with agents that list "links/2" (agent.proto LinkCounters), from the QUIC connection itself:
//   - client_closes: connections the client closed itself.
//   - freezes: idle timeouts after the node had kept sending and nothing came back: the path froze (how a TSPU freeze looks)
//     or the client vanished mid-transfer. What tells a freeze from an app check, unlike drops. It needs a stats snapshot
//     in the silence: the idle timeout (30 s) is longer than the stats interval (10 s).
//   - quiet: idle timeouts in which neither side had anything to send: the client went away without closing (app checks,
//     auto-select, a phone asleep). Harmless.
//   - accepted: QUIC handshakes that completed; hellos - accepted never completed (a cut path, an app that gave up, or a
//     scanner: hellos_foreign tells how many hellos were for another name), accepted - handshakes never asked to
//     authenticate (pings).
//   - hellos_foreign: ClientHellos for another server name (scanners).
//   - rtt_ms (average smoothed RTT of connections that moved data, over rtt_samples samples) and loss_permille (packets
//     the node declared lost per thousand it sent, over pkts_sent): how fast and clean the path was.
message InboundConnections {
  string inbound_id = 1;
  string profile_id = 2;
  string profile_name = 3;
  string protocol = 4;
  uint32 connects = 5;
  uint32 rejects = 6;
  uint32 drops = 7;
  uint32 stalls = 8;
  uint64 online_s = 9 [jstype = JS_NUMBER];
  uint32 unknown_keys = 10;
  // Hysteria2: handshakes started and those that reached authentication, without the panel's own synthetic checks (the health
  // probe key's handshakes are taken off; at the window's edges by a check or two).
  uint32 hellos = 11;
  uint32 handshakes = 12;
  // Keys that had a stall, and keys that tried at all (a connect or a stall), in the window.
  uint32 keys_stalled = 13;
  uint32 keys_tried = 14;
  // The counters this protocol, or this node's agent, does not count (their zero means nothing): awg "rejects", "drops",
  // "hellos", "handshakes" and every links/2 counter; vless every counter until its agent counts them; hysteria2 on an
  // agent without "links/2" the links/2 counters (client_closes, freezes, quiet, accepted, hellos_foreign, rtt_ms,
  // loss_permille, rtt_samples, pkts_sent).
  repeated string unsupported = 15;
  // With by_hour: the hours of the window that have a counter, oldest first.
  repeated LinkHour hours = 16;
  // The window by the devices' current app label (Device.client and .platform), most activity first (connects, rejects,
  // drops and stalls together, so a failing app is not pushed out), at most 8; keys whose device is gone are not in it.
  repeated ClientConnections clients = 17;
  // AmneziaWG inbounds only: what the node's last health report says of its UDP port.
  AwgPackets awg = 18;
  uint32 client_closes = 19;
  uint32 freezes = 20;
  uint32 quiet = 21;
  uint32 accepted = 22;
  uint32 hellos_foreign = 23;
  uint32 rtt_ms = 24;
  uint32 loss_permille = 25;
  uint32 rtt_samples = 26;
  uint64 pkts_sent = 27 [jstype = JS_NUMBER];
}

message ClientConnections {
  // As the device reported it ("Happ/6.1.0"); "" unknown.
  string client = 1;
  string platform = 2;
  uint32 devices = 3;
  uint32 connects = 4;
  uint32 rejects = 5;
  uint32 drops = 6;
  uint32 stalls = 7;
  uint64 online_s = 8 [jstype = JS_NUMBER];
  uint32 freezes = 9;
  uint32 quiet = 10;
  uint32 rtt_ms = 11;
  uint32 loss_permille = 12;
}

message AwgPackets {
  // Packets that reached the inbound's UDP port since the counter started (the node's nft counter of the port): it grows
  // while anything, a device or a scanner, sends to the port, also when no handshake follows. Compare two reads.
  uint64 udp_rx_packets = 1 [jstype = JS_NUMBER];
  int64 reported_unix = 2 [jstype = JS_NUMBER];
  // "kernel" or "userspace".
  string backend = 3;
  // Peers with a handshake in the last 3 minutes.
  uint32 peers_online = 4;
}

message GetNodeConnectionsResponse {
  // false: the node's agent does not send connection counters (it does not list "links/1"); inbounds is then empty.
  bool supported = 1;
  int64 since_unix = 2 [jstype = JS_NUMBER];
  int64 now_unix = 3 [jstype = JS_NUMBER];
  // The node's inbounds that are not removed, in the order of the node page.
  repeated InboundConnections inbounds = 4;
}

message StreamLogsRequest {
  string node_id = 1;
  // "agent", "hysteria2". Empty = all.
  repeated string sources = 2;
  // Max 1000.
  uint32 tail_lines = 3;
  bool follow = 4;
  LogLevel min_level = 5;
}

message LogLine {
  int64 time_unix_ms = 1 [jstype = JS_NUMBER];
  LogLevel level = 2;
  string source = 3;
  string message = 4;
}

message StreamLogsResponse {
  repeated LogLine lines = 1;
  bool eof = 2;
  uint32 dropped = 3;
  string error = 4;
}

enum LogLevel {
  // As a filter: all levels.
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_INFO = 1;
  LOG_LEVEL_WARNING = 2;
  LOG_LEVEL_ERROR = 3;
}
