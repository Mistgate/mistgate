syntax = "proto3";

package mistgate.admin.v1;

// Owner-only SSH installation of a Mistgate node. Credentials are accepted only after the
// administrator has confirmed the SSH host-key fingerprint shown by GetSSHFingerprint.
service ProvisioningService {
  rpc GetSSHFingerprint(GetSSHFingerprintRequest) returns (GetSSHFingerprintResponse);
  rpc GetPanelSSHKey(GetPanelSSHKeyRequest) returns (GetPanelSSHKeyResponse);
  rpc CheckSSH(CheckSSHRequest) returns (CheckSSHResponse);
  rpc StartNodeProvision(StartNodeProvisionRequest) returns (StartNodeProvisionResponse);
  rpc RetryNodeProvision(RetryNodeProvisionRequest) returns (RetryNodeProvisionResponse);
  rpc GetNodeProvision(GetNodeProvisionRequest) returns (GetNodeProvisionResponse);
  rpc ListNodeProvisions(ListNodeProvisionsRequest) returns (ListNodeProvisionsResponse);
  rpc ListNodeProvisionEvents(ListNodeProvisionEventsRequest) returns (ListNodeProvisionEventsResponse);
  rpc ListNodeServerAccess(ListNodeServerAccessRequest) returns (ListNodeServerAccessResponse);
  rpc ListNodeServerKeys(ListNodeServerKeysRequest) returns (ListNodeServerKeysResponse);
  rpc AddNodeServerKey(AddNodeServerKeyRequest) returns (AddNodeServerKeyResponse);
  rpc RemoveNodeServerKey(RemoveNodeServerKeyRequest) returns (RemoveNodeServerKeyResponse);
  rpc AttachNodeServerAccess(AttachNodeServerAccessRequest) returns (AttachNodeServerAccessResponse);
  rpc RotateNodeServerPassword(RotateNodeServerPasswordRequest) returns (RotateNodeServerPasswordResponse);
  rpc RevealNodeServerPassword(RevealNodeServerPasswordRequest) returns (RevealNodeServerPasswordResponse);
  // Owner-only, step-up protected: deletes the saved access of a retired node, its sealed password included.
  rpc ForgetNodeServerAccess(ForgetNodeServerAccessRequest) returns (ForgetNodeServerAccessResponse);
}

message GetPanelSSHKeyRequest {}

message GetPanelSSHKeyResponse {
  string public_key = 1;
  string fingerprint = 2;
}

message GetSSHFingerprintRequest {
  string host = 1;
  uint32 port = 2;
}

message GetSSHFingerprintResponse {
  string host = 1;
  uint32 port = 2;
  string fingerprint = 3;
  // The key type the fingerprint belongs to ("ssh-ed25519", "ecdsa-sha2-nistp256", "ssh-rsa"): a provider's console
  // lists one fingerprint per type, so the owner needs it to compare the right one.
  string algorithm = 4;
}

message CheckSSHRequest {
  string host = 1;
  uint32 port = 2;
  string fingerprint = 3;
  string password = 4;
  string username = 5;
  // When true, password must be empty and the panel uses its public key's private half.
  bool use_panel_key = 6;
  // An owner's private key is used only for this check. It is never retained.
  string private_key = 7;
  string private_key_passphrase = 8;
}

message NodePreflight {
  string distribution = 1;
  string version = 2;
  string kernel = 3;
  string architecture = 4;
  uint32 cpu_count = 5;
  uint64 memory_bytes = 6 [jstype = JS_NUMBER];
  uint64 disk_available_bytes = 7 [jstype = JS_NUMBER];
  bool systemd = 8;
  bool already_enrolled = 9;
  bool panel_reachable = 10;
}

message CheckSSHResponse {
  NodePreflight preflight = 1;
}

message StartNodeProvisionRequest {
  bool confirm_install = 1;
  string name = 2;
  string address = 3;
  string country_code = 4;
  string location = 5;
  string provider = 6;
  string ssh_host = 7;
  uint32 ssh_port = 8;
  string fingerprint = 9;
  string password = 10;
  string ssh_username = 11;
  // MCP only: the approved node_install plan being applied. password stays empty: the panel uses the password the owner
  // chose on that plan's approval screen, and only with the fingerprint the owner confirmed there.
  string plan_id = 12;
  // Direct installs: when true, password must be empty and the panel key is used.
  bool use_panel_key = 13;
  // For wizard requests, the UI sends true by default and false only when the owner opts out.
  bool install_panel_key = 14;
  // An owner's private key is used for this install only; the worker replaces it with the panel key for saved access.
  string private_key = 15;
  string private_key_passphrase = 16;
}

message RetryNodeProvisionRequest {
  string job_id = 1;
  bool confirm_install = 2;
  string password = 3;
  string ssh_username = 4;
  // When true, password must be empty and the panel key is used.
  bool use_panel_key = 5;
  string private_key = 6;
  string private_key_passphrase = 7;
  // When true, the panel key is added and verified before access is saved.
  bool install_panel_key = 8;
}

message StartNodeProvisionResponse {
  NodeProvisionJob job = 1;
}

message RetryNodeProvisionResponse {
  NodeProvisionJob job = 1;
}

message GetNodeProvisionRequest {
  string job_id = 1;
}

message GetNodeProvisionResponse {
  NodeProvisionJob job = 1;
}

message ListNodeProvisionsRequest {}

message ListNodeProvisionsResponse {
  repeated NodeProvisionJob jobs = 1;
}

message NodeProvisionJob {
  string id = 1;
  string node_id = 2;
  string name = 3;
  string ssh_host = 4;
  uint32 ssh_port = 5;
  string state = 6;
  string phase = 7;
  string error_code = 8;
  int64 created_unix = 9 [jstype = JS_NUMBER];
  int64 updated_unix = 10 [jstype = JS_NUMBER];
}

message ListNodeProvisionEventsRequest {
  string job_id = 1;
  uint64 after_id = 2 [jstype = JS_NUMBER];
  uint32 limit = 3;
}

message NodeProvisionEvent {
  uint64 id = 1 [jstype = JS_NUMBER];
  string phase = 2;
  string code = 3;
  int64 created_unix = 4 [jstype = JS_NUMBER];
}

message ListNodeProvisionEventsResponse {
  repeated NodeProvisionEvent events = 1;
  uint64 next_after_id = 2 [jstype = JS_NUMBER];
}

// Public SSH access metadata. Passwords and their ciphertext never leave the panel.
message NodeServerAccess {
  string node_id = 1;
  // The node's current name.
  string node_name = 2;
  string host = 3;
  uint32 port = 4;
  string username = 5;
  string fingerprint = 6;
  int64 configured_unix = 7 [jstype = JS_NUMBER];
  bool rotation_pending = 8;
  // The panel generated the saved password (a rotation through MCP): only the panel knows it.
  bool password_generated = 9;
  // The node is retired. Its access stays, so the owner can still reveal the password, until it is forgotten.
  bool node_retired = 10;
  // False when this node has no saved SSH password (for example, a panel-key install).
  bool password_saved = 11;
  // Whether the saved password last authenticated over SSH; false also for key-only installs not yet checked.
  bool password_login = 12;
  // SHA256 fingerprint of the panel key, empty when this node uses another login method.
  string panel_key_fingerprint = 13;
}

message ListNodeServerAccessRequest {}
message ListNodeServerAccessResponse { repeated NodeServerAccess access = 1; }

// A public authorized_keys entry. Comments are untrusted server text and are cleaned before they are returned.
message NodeServerKey {
  string type = 1;
  uint32 bits = 2;
  string fingerprint = 3;
  string comment = 4;
  bool panel_key = 5;
  bool restricted = 6;
  uint32 lines = 7;
}
message ListNodeServerKeysRequest { string node_id = 1; }
message ListNodeServerKeysResponse {
  repeated NodeServerKey keys = 1;
  uint32 other_lines = 2;
}
message AddNodeServerKeyRequest {
  string node_id = 1;
  string public_key = 2;
  bool panel_key = 3;
  bool confirm = 4;
}
message AddNodeServerKeyResponse { NodeServerKey key = 1; }
message RemoveNodeServerKeyRequest {
  string node_id = 1;
  string fingerprint = 2;
  bool confirm = 3;
  bool confirm_panel_key = 4;
}
message RemoveNodeServerKeyResponse {}

// Attach access to a node that was enrolled outside the SSH installer.
message AttachNodeServerAccessRequest {
  string node_id = 1;
  string ssh_host = 2;
  uint32 ssh_port = 3;
  string fingerprint = 4;
  string username = 5;
  string password = 6;
  bool use_panel_key = 7;
  string private_key = 8;
  string private_key_passphrase = 9;
  bool install_panel_key = 10;
  bool confirm = 11;
}
message AttachNodeServerAccessResponse {
  NodeServerAccess access = 1;
  // Non-empty when password access was attached but the optional panel key could not be installed.
  string panel_key_error = 2;
}

message RotateNodeServerPasswordRequest {
  string node_id = 1;
  // The owner's new password (at least 12 characters); empty when generate is set.
  string new_password = 2;
  bool confirm = 3;
  // The panel generates a strong random password itself; it is never returned (the owner can reveal it).
  bool generate = 4;
}
message RotateNodeServerPasswordResponse { bool rotated = 1; }

// Owner-only, step-up protected retrieval. This procedure is deliberately not exposed as an MCP tool.
message RevealNodeServerPasswordRequest { string node_id = 1; }
message RevealNodeServerPasswordResponse {
  string password = 1;
  // Set only when a password change was interrupted and the server could not be reached to tell which login works:
  // password is then the last verified one and pending_password the replacement that may already be in effect.
  // Neither is verified; the SPA labels them so.
  string pending_password = 2;
  bool unverified = 3;
}

message ForgetNodeServerAccessRequest { string node_id = 1; }
message ForgetNodeServerAccessResponse {}
