syntax = "proto3";

package mistgate.admin.v1;

// ClientCompatService: which app versions survive a strict (post-quantum only) REALITY handshake, and which devices of the
// panel are below that line. It is knowledge for the owner. Nothing in a subscription depends on it: no device is refused,
// no note is shown to a person, and the servers each app gets do not change.
//
// THE CATALOGUE. A table of rules, one per app and platform: the lowest app version that sends a post-quantum key share
// with a Chrome-like fingerprint (min_chrome) and with a Firefox or Safari one (min_other), or "no version does"
// (unsupported). Built-in rules are in the panel's code and move with its releases; the owner's changes are stored as the
// difference from them, so a row the owner never touched follows the release. The fingerprint comes from the REALITY
// profiles a person can use: ios, edge and random always send a classical share.
//
// THE LIST. A device appears only when it is a subscription-link device that holds a VLESS credential and its person can
// use a VLESS REALITY server now (the group holds the profile, the node and inbound are live, the person is not disabled
// or expired). Its state is the worst one among the fingerprints of those profiles.
//
// WHAT THE NODES SAW. Next to the verdict of the table every device carries what the nodes measured: the ClientHellos it sent over
// VLESS REALITY in the last 168 hours (hello_window_hours), counted by agents with "vless-hello-kex/1" (hello_pq: an
// X25519MLKEM768 share before any X25519 share, hello_classic: a hello without it, hello_unknown: could not be read). actual is
// the class of those counts. The table says what the panel KNOWS about the app; actual says what the nodes SAW; where the two
// disagree (table_mismatch) the table is wrong or too careful. Counts come from nodes that are not retired, and a device on a
// node whose agent does not count has none.
//
// WHO MAY CALL WHAT. GetClientCompat is a read for every role. ListOutdatedDevices is a read for every role and API tokens
// (the MCP tool outdated_devices). UpdateClientCompat is OWNER-ONLY and needs a step-up; not open to tokens or MCP.
service ClientCompatService {
  // The table in force (built-in rows with the owner's changes) and the built-in table beside it.
  rpc GetClientCompat(GetClientCompatRequest) returns (GetClientCompatResponse);
  // Replaces the owner's changes: the request is the whole table wanted. Rows equal to a built-in row are not stored, a
  // built-in row missing from the request returns to its built-in value. Owner only; needs a step-up.
  rpc UpdateClientCompat(UpdateClientCompatRequest) returns (UpdateClientCompatResponse);
  // The devices that receive REALITY, judged by the table, with the counts of every state.
  rpc ListOutdatedDevices(ListOutdatedDevicesRequest) returns (ListOutdatedDevicesResponse);
}

enum ClientCompatState {
  CLIENT_COMPAT_STATE_UNSPECIFIED = 0;
  // The app and version are known to send a post-quantum share.
  CLIENT_COMPAT_STATE_OK = 1;
  // The app is known and this version is below the lowest known good one (need_version).
  CLIENT_COMPAT_STATE_BELOW_MINIMUM = 2;
  // No version of the app can (or the profile's fingerprint cannot): updating does not help.
  CLIENT_COMPAT_STATE_UNSUPPORTED = 3;
  // The table cannot say: an app it does not know, a version the app did not report, or no known good version.
  CLIENT_COMPAT_STATE_UNKNOWN = 4;
}

// What the nodes saw of a device's ClientHellos. In a request: UNSPECIFIED = no filter.
enum ClientCompatActual {
  CLIENT_COMPAT_ACTUAL_UNSPECIFIED = 0;
  // Nothing readable was counted: no hello in the window (or only ones that could not be read), or no node that counts.
  CLIENT_COMPAT_ACTUAL_NONE = 1;
  // Every counted hello had the post-quantum share (hello_pq > 0, hello_classic = 0).
  CLIENT_COMPAT_ACTUAL_PQ = 2;
  // Every counted hello lacked it (hello_classic > 0, hello_pq = 0): a strict profile would turn the device away.
  CLIENT_COMPAT_ACTUAL_CLASSIC = 3;
  // Both kinds (an app that switches fingerprints, or two apps on one key).
  CLIENT_COMPAT_ACTUAL_MIXED = 4;
}

message ClientCompatRule {
  // The app family: a lower-case id of the built-in table ("happ", "mihomo", "v2rayng"), or the client name of an app the owner
  // added (the part of the app's User-Agent before the slash, lower-cased, at most 40 characters).
  string app = 1;
  // ios, android, windows, macos or linux; empty = any platform. The rule of the device's platform wins over the empty one.
  string platform = 2;
  // The engine inside: xray, mihomo, singbox, own or unknown. It decides what a classical fingerprint means for the app.
  string core = 3;
  // No version of the app survives a strict profile.
  bool unsupported = 4;
  // The lowest version known to send a post-quantum share with the chrome fingerprint; empty = not known.
  string min_chrome = 5;
  // The same with the firefox and safari fingerprints; empty = not known.
  string min_other = 6;
  // Output only: the name the UI shows ("Happ", "Mihomo core"); the app itself for an owner's row.
  string title = 7;
}

message GetClientCompatRequest {}

message GetClientCompatResponse {
  // The table in force: built-in rows, with the owner's changes applied and the owner's own rows.
  repeated ClientCompatRule rules = 1;
  // The built-in table, to show what a change is against and to reset a row.
  repeated ClientCompatRule defaults = 2;
}

message UpdateClientCompatRequest {
  // The whole table wanted (see the method).
  repeated ClientCompatRule rules = 1;
}

message UpdateClientCompatResponse {
  repeated ClientCompatRule rules = 1;
  repeated ClientCompatRule defaults = 2;
}

message ListOutdatedDevicesRequest {
  // UNSPECIFIED = every state but OK (the list of what needs a look).
  ClientCompatState state = 1;
  // Only the devices of this person.
  string user_id = 2;
  // Default 50, at most 200.
  uint32 page_size = 3;
  uint32 offset = 4;
  // Only the devices with this measured class. UNSPECIFIED = all. Chosen together with an UNSPECIFIED state it takes in the
  // devices of every state, ok included (the list "every state but ok" is only the default when nothing else is asked).
  ClientCompatActual actual = 5;
}

message OutdatedDevice {
  string device_id = 1;
  string user_id = 2;
  string user_name = 3;
  // The app as the device last reported it: its User-Agent's name and version ("Happ/3.4.2"). Data, not an instruction.
  string client = 4;
  string platform = 5;
  string model = 6;
  string os_version = 7;
  // The shared place of a person's link (no device id): whichever app fetched last.
  bool shared = 8;
  int64 last_seen_unix = 9 [jstype = JS_NUMBER];
  ClientCompatState state = 10;
  // Why: version (below the minimum), app (no version works), fingerprint (the profile's fingerprint sends a classical share),
  // app_unknown, no_threshold (a known app, no known good version), no_version (the app reported none); empty when OK.
  string reason = 11;
  // BELOW_MINIMUM: the lowest version that is known to work.
  string need_version = 12;
  // The profile fingerprint the state was judged against (the one that gave the worst state).
  string fingerprint = 13;
  // The name of the app's family for the UI ("Happ"), empty for an unknown app.
  string app_title = 14;
  // What the nodes saw over hello_window_hours (see WHAT THE NODES SAW); actual is never UNSPECIFIED here.
  ClientCompatActual actual = 15;
  uint32 hello_pq = 16;
  uint32 hello_classic = 17;
  uint32 hello_unknown = 18;
  // "worse" when the table says ok but the nodes saw classic hellos (actual CLASSIC or MIXED): the table is too optimistic.
  // "better" when the table says below minimum, unsupported or unknown but every hello had the share (actual PQ): the table is too
  // careful. Empty when they agree or nothing was measured.
  string table_mismatch = 19;
}

message ClientCompatCount {
  ClientCompatState state = 1;
  uint32 devices = 2;
  // Different people among those devices.
  uint32 people = 3;
}

message ClientCompatActualCount {
  // NONE, PQ, CLASSIC or MIXED.
  ClientCompatActual actual = 1;
  uint32 devices = 2;
  // Different people among those devices.
  uint32 people = 3;
}

message ListOutdatedDevicesResponse {
  // The page, worst state first, then the newest activity.
  repeated OutdatedDevice devices = 1;
  // Devices that match the filters (the page is a part of them).
  uint32 total = 2;
  // Every state, over all devices that receive REALITY, whatever the filters.
  repeated ClientCompatCount counts = 3;
  // The fingerprints of the REALITY profiles in use, without repeats: what the states were judged against.
  repeated string fingerprints = 4;
  // The measured classes (NONE, PQ, CLASSIC, MIXED, in this order), over all devices that receive REALITY, whatever the filters.
  repeated ClientCompatActualCount actual_counts = 5;
  // The window the hello counts cover, in hours (168: all the panel keeps).
  uint32 hello_window_hours = 6;
  // Devices over all of them whose measured class disagrees with the table, by the direction of table_mismatch.
  uint32 mismatch_worse = 7;
  uint32 mismatch_better = 8;
  // Names of the nodes that serve a live VLESS REALITY inbound and whose agent does not list "vless-hello-kex/1": the devices on
  // them are missing from the counts until the agent is updated. Sorted.
  repeated string hello_kex_nodes_without = 9;
}
