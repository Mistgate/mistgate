syntax = "proto3";

package mistgate.admin.v1;

import "mistgate/admin/v1/common.proto";

// SubscriptionService configures what subscriptions look like: names and texts, which app the public user
// page recommends on each platform, how server names are rendered, and which format a client gets.
// Settings apply at request time (no restart); the subscription handler reads them on every fetch
// through a small in-memory cache that UpdateSubscriptionSettings invalidates.
service SubscriptionService {
  rpc GetSubscriptionSettings(GetSubscriptionSettingsRequest) returns (GetSubscriptionSettingsResponse);
  rpc UpdateSubscriptionSettings(UpdateSubscriptionSettingsRequest) returns (UpdateSubscriptionSettingsResponse);
  // "Formats & clients" tab: which client apps the registered protocol plugins support.
  rpc ListClients(ListClientsRequest) returns (ListClientsResponse);
  // "Serving rules" tab: which rule and format a sample User-Agent gets.
  rpc TestUserAgent(TestUserAgentRequest) returns (TestUserAgentResponse);
  // "Response headers" tab: the headers of the list (the editor's draft, checked like a save) one person gets with one
  // User-Agent. INVALID_ARGUMENT for a list that a save would refuse; NOT_FOUND for an unknown person.
  rpc PreviewResponseHeaders(PreviewResponseHeadersRequest) returns (PreviewResponseHeadersResponse);
  // "Mihomo templates" tab: the profile one person would get from the editor's draft of a template, as the Mihomo answer builds it
  // (nothing is written: no device, no credential), and what the owner should look at. INVALID_ARGUMENT for a text that a save
  // would refuse; NOT_FOUND for an unknown person.
  rpc PreviewMihomoTemplate(PreviewMihomoTemplateRequest) returns (PreviewMihomoTemplateResponse);
  // "Routing" tab: reads what the owner pasted (link, base64 or JSON) as a save does and returns the entry it would store, with its
  // info and the mode of a link. INVALID_ARGUMENT with the reason for a text that a save would refuse. Nothing is written.
  rpc PreviewRoutingProfile(PreviewRoutingProfileRequest) returns (PreviewRoutingProfileResponse);
}

message SubscriptionSettings {
  // Subscription name shown in apps (profile-title). Empty = the instance brand.
  string title = 1;
  // Announcement shown in apps (announce header) and on the user page. Empty = none.
  string announcement = 2;
  // Support link (support-url header, "Message support" on the user page). Empty = none.
  string support_url = 3;
  // Hours between app refreshes (profile-update-interval). 0 = 12.
  uint32 update_interval_hours = 4;
  // Server name template. Placeholders: {flag} (emoji from the node country), {country} (the two-letter
  // country code), {node} (node name), {profile} (profile name). Empty = "{flag} {country} · {profile}". When servers
  // of one user render to the same name, the second gets " 2", the third " 3" ("🇩🇪 DE · Hysteria2 2").
  string server_name_template = 5;
  // What the user page recommends, per platform and access kind. Order = display order.
  repeated PlatformApp apps = 6;
  UserPageOptions user_page = 7;
  // Tried in order; the first match wins. No match: a browser-like User-Agent gets the user page,
  // anything else gets SUB_FORMAT_BASE64_URIS.
  repeated ServeRule rules = 8;
  // DNS preset for users and groups that have none of their own (DnsService). Empty = the built-in default.
  string default_dns_preset_id = 9;
  // What a subscription fetch does when a person has no room for one more device (device_limit): count it only, refuse it,
  // or refuse it and also turn away the apps that report no device ID. Absent in a request = leave the stored mode as it is;
  // a panel that has never been given one counts only (LINK_DEVICE_LIMIT_TRACK).
  optional LinkDeviceLimit link_device_limit = 10;
  // The DNS presets a person may pick on their page for the apps that take the link (Happ, the Mihomo apps, Xray JSON, sing-box):
  // one DNS for all servers, since these apps have one resolver for the whole subscription. Kept by the DNS module, like
  // default_dns_preset_id. Absent in a request = leave the stored offer as it is.
  LinkDnsOptions link_dns = 11;
  // How Happ pings the servers of the subscription. Unspecified = the app's own default: no ping headers are sent.
  HappPing happ_ping = 12;
  // With happ_ping set: Happ pings the servers each time it opens (subscription-ping-onopen-enabled: 1, else 0).
  bool happ_ping_on_open = 13;
  // AmneziaWG servers in what the subscription link hands out (today only the Mihomo profile carries them).
  // Absent = true: settings stored before this switch existed keep today's behaviour.
  optional bool link_awg = 14;
  // Include automatic server selection in Mihomo and sing-box subscription profiles; absent means on.
  optional bool link_auto_select = 15;
  // Days without a connection or subscription fetch before a device stops counting. 0 disables idling; otherwise 7 to 365.
  // Absent in an update = keep the stored setting.
  optional uint32 device_idle_after_days = 16;
  // The owner's own response headers of a successful subscription answer (e.g. flclashx-servicename). In order: when two
  // entries of one name both apply, the first wins. Refusals (device limit, a blocked device, no access) carry none of them.
  repeated ResponseHeader response_headers = 17;
  // The owner's own Mihomo YAML profiles, one for each of the groups they name; a person of a group that no template names gets the
  // panel's own profile. The list is replaced as a whole. Checked on save (see MihomoTemplate); at most 20 templates, 64 KiB each and
  // 256 KiB in all.
  repeated MihomoTemplate mihomo_templates = 18;
  // The owner's own routing profiles for the apps Happ and INCY, one for each of the groups they name; a person gets one profile at most,
  // by their main group. The list is replaced as a whole. Checked on save (see RoutingProfile); at most 20 profiles.
  repeated RoutingProfile routing_profiles = 19;
  // Seconds between the server checks of the Auto group in the Mihomo, sing-box and Xray JSON documents: 60, 120, 300 or 600.
  // Absent = 300 (what these documents always had).
  optional uint32 link_auto_interval = 20;
}

// One routing profile of the owner, for Happ and INCY: what goes direct, through the VPN and to the block list, the app's DNS and the
// geo files. The owner pastes a link (`happ://routing/onadd/...`, `incy://...`, `://routing/add/...`), the bare base64 or the JSON; a
// save reads it, keeps only the fields the two apps document (the others are named in info.dropped_fields and left out) and stores the
// JSON the panel writes out of them, so what the apps get is never the pasted text. An answer to Happ carries the profile as
// `happ://routing/<add|onadd>/<base64>`, one to INCY as `incy://...`, in the `routing` header while the link is at most 3000 bytes, else
// on a line of the subscription body. The person's own DNS preset replaces the DNS fields of the profile; the rules stay the owner's.
// A save is refused (INVALID_ARGUMENT, the text names the field) for a text that is no profile, a field of the wrong type, a geo-file or
// DoH address that is not https, a profile over 32 KiB, a name used twice, a group in two profiles or two profiles for all groups.
message RoutingProfile {
  // What the owner pasted, or the JSON the panel stored; always the stored JSON in a response.
  string profile = 1;
  // false = the app adds the profile and turns it on (`onadd`); true = it adds it and the person turns it on (`add`).
  bool only_add = 2;
  // false = every group; true = only the people whose main group is in group_ids (none listed = nobody gets it).
  bool only_groups = 3;
  // Group ids, only with only_groups; at most 100. A group that is deleted later drops out the next time the settings are saved.
  repeated string group_ids = 4;
  // What the profile holds, in numbers. Filled by the panel in a response, ignored in a request.
  RoutingInfo info = 5;
}

// What a stored routing profile holds, for the admin to show in words.
message RoutingInfo {
  string name = 1;
  uint32 direct_sites = 2;
  uint32 direct_ip = 3;
  uint32 proxy_sites = 4;
  uint32 proxy_ip = 5;
  uint32 block_sites = 6;
  uint32 block_ip = 7;
  // "DoH", "DoU" or "" (the app's own), and the address: the DoH URL, else the IP.
  string remote_dns_type = 8;
  string remote_dns = 9;
  string domestic_dns_type = 10;
  string domestic_dns = 11;
  // Entries of DnsHosts.
  uint32 hosts = 12;
  string geoip_address = 13;
  string geosite_address = 14;
  // "true", "false" or "": what the app does with traffic no rule names.
  string global_proxy = 15;
  string domain_strategy = 16;
  string fake_dns = 17;
  string last_updated = 18;
  bool use_chunk_files = 19;
  // Fields of the pasted text that the panel does not keep (at most 10, names only). Filled by PreviewRoutingProfile only.
  repeated string dropped_fields = 20;
  // The stored JSON in bytes, and the bytes of the Happ link of it without the person's DNS (the header holds at most 3000).
  uint32 profile_bytes = 21;
  uint32 header_bytes = 22;
}

// One Mihomo YAML profile of the owner. The panel puts the servers of the person at the start of its `proxies` and, while
// link_auto_select is on and the template has no group of that name, adds a url-test group `Auto` over them at the end of its
// `proxy-groups`; groups take the servers with `include-all-proxies` or `filter`. `dns` is added (resolvers of the person's preset,
// respect-rules on) only when the template has none. Everything else is left as written, comments included. The panel never
// fetches a URL of a template.
//
// A save is refused (INVALID_ARGUMENT, the text names the line) unless the text is one valid YAML document that parses in full (no
// alias bomb, no repeated key), has a mapping at its root, `proxies` and `proxy-groups` that are lists (or absent) with named
// entries, groups that refer only to names of the template, the core and `Auto`, and `use` that names its `proxy-providers`; a
// group may be in one template only. Names are unique without regard to case.
message MihomoTemplate {
  // 1 to 60 characters; how the editor and MCP call the template.
  string name = 1;
  // The text, 1 byte to 64 KiB, UTF-8.
  string yaml = 2;
  // The groups whose people get this template (at most 100). A group that is deleted later drops out of the list the next time the
  // settings are saved; a template without groups serves nobody.
  repeated string group_ids = 3;
}

// One response header the owner adds to the subscription answer the apps fetch. The name is an HTTP token (RFC 9110) that is
// none of the panel's own headers (GetSubscriptionSettingsResponse.reserved_header_names); the value has no control
// characters; at most 20 entries, a name of at most 64 bytes, a value of at most 1000 bytes and 4096 bytes in all.
message ResponseHeader {
  string name = 1;
  string value = 2;
  // Send the value as "base64:" plus its base64, the way the panel sends the title (apps that read text headers decode it).
  bool base64 = 3;
  // The answer formats it goes with: SUB_FORMAT_BASE64_URIS, _MIHOMO_YAML, _XRAY_JSON or _SINGBOX_JSON. Empty = all of them.
  repeated SubFormat formats = 4;
  // false = every group; true = only the people of group_ids (none listed = nobody gets it).
  bool only_groups = 5;
  // Group ids, only with only_groups. A group that is deleted later drops out of the list the next time the settings are saved.
  repeated string group_ids = 6;
}

// The ping-type header Happ is sent (only Happ, only when set), with ping-result: time (the delay in ms, not an icon).
enum HappPing {
  HAPP_PING_UNSPECIFIED = 0;
  // ping-type: tcp, a TCP connection to the server's address and port.
  HAPP_PING_TCP = 1;
}

// What the owner offers for the link apps. A person's pick applies while it is offered; without one, their link apps get the
// user's own preset, else the group's, else default_preset_id, else the instance default.
message LinkDnsOptions {
  // In the order the page lists them; at most 20. Empty = the page offers no choice for the link apps.
  repeated string preset_ids = 1;
  // One of preset_ids, or "" (the instance default stays the default).
  string default_preset_id = 2;
}

// How the device limit applies to the apps that take the subscription link (a key of AmneziaVPN is always limited).
enum LinkDeviceLimit {
  LINK_DEVICE_LIMIT_UNSPECIFIED = 0;
  // Devices are registered and counted, the limit is shown and an event is written, but nothing is refused. A person
  // with twice the limit in devices gets no device of their own for one more HWID: that app shares the common place.
  LINK_DEVICE_LIMIT_TRACK = 1;
  // A new device over the limit is refused; the apps that report no device ID share one common place, if there is room.
  LINK_DEVICE_LIMIT_ENFORCE = 2;
  // As ENFORCE, and an app that reports no device ID is refused. Switching to it revokes every common place at once.
  LINK_DEVICE_LIMIT_STRICT = 3;
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_IOS = 1;
  PLATFORM_ANDROID = 2;
  PLATFORM_WINDOWS = 3;
  PLATFORM_MACOS = 4;
  PLATFORM_LINUX = 5;
}

// One app the user page recommends: e.g. iOS + APP_HAPP -> "Happ" (App Store link, happ://add/{url}),
// Windows + APP_HAPP -> an instance's own desktop client, any platform + APP_AMNEZIA -> AmneziaVPN.
message PlatformApp {
  Platform platform = 1;
  // APP_HAPP = apps that take the subscription link ("by subscription link" in the admin UI); APP_AMNEZIA = apps that take
  // per-device AWG keys ("AmneziaWG key"). The enum names are kept for compatibility.
  App kind = 2;
  string name = 3;
  string download_url = 4;
  // One-tap "add" link. Placeholders: {url} (subscription URL as is), {url_enc} (URL-encoded),
  // {name_enc} (URL-encoded subscription title). Empty = the page offers "copy the link" instead.
  string add_link_template = 5;
  // One plain-text line on the app's card of the public page ("what you get"); at most 80 characters. Empty = none.
  string description = 6;
  // Marks the app with a "recommended" badge on the card. Several apps may share a platform and a kind.
  bool recommended = 7;
}

message UserPageOptions {
  bool show_announcement = 1;
  bool show_support = 2;
  bool show_qr = 3;
  // Users may add, rotate and revoke their own AmneziaWG devices on the public page (limited by the user's
  // device limit, a per-token write counter and the token itself). Absent = true: settings stored before AmneziaWG
  // support have no such key and must not silently turn the feature off.
  optional bool allow_device_self_service = 4;
  // The user's page asks for a password (shown to the admin next to the link) before it shows anything or answers a
  // self-service call. The subscription itself, which apps fetch from the same address, is never gated. Absent = true:
  // settings stored before this key existed turn it on, which is the default.
  optional bool require_page_password = 5;
  // People may pick, on their page, one of the DNS presets the owner offers on each server (DnsService.SetNodeDnsOptions).
  // Absent = false: a new feature does not switch itself on for settings stored before it existed.
  optional bool allow_dns_choice = 6;
  // People may take, on their page, the AmneziaWG key "Russian services direct" next to the ordinary one: its AllowedIPs leave the
  // networks of the big Russian services out, so they do not see the node's address. Absent = false: a new feature does not
  // switch itself on for settings stored before it existed.
  optional bool allow_ru_direct_key = 7;
}

enum SubFormat {
  SUB_FORMAT_UNSPECIFIED = 0;
  // base64 list of share links (hysteria2://…): Happ, v2rayNG, mihomo-based desktop clients, …
  SUB_FORMAT_BASE64_URIS = 1;
  // The public HTML user page (browsers).
  SUB_FORMAT_USER_PAGE = 2;
  // Pretend the link does not exist (the decoy 404).
  SUB_FORMAT_DECOY = 3;
  // Mihomo / Clash Meta YAML with every protocol the user has.
  SUB_FORMAT_MIHOMO_YAML = 4;
  // An array of Xray configs, one per server, each with its remarks (v2rayNG, Happ and the other Xray-based apps).
  SUB_FORMAT_XRAY_JSON = 5;
  // One sing-box profile: a TUN inbound, a selector over the servers, the DNS of the user's preset (sing-box 1.12 and later).
  SUB_FORMAT_SINGBOX_JSON = 6;
}

message ServeRule {
  // Case-insensitive substring of the User-Agent, e.g. "mihomo", "happ", "curl".
  string ua_contains = 1;
  SubFormat format = 2;
}

message GetSubscriptionSettingsRequest {}

message GetSubscriptionSettingsResponse {
  SubscriptionSettings settings = 1;
  // The effective subscription title (settings.title or the brand), for placeholders in the UI.
  string effective_title = 2;
  // What a person of the group most people are in gets in Happ right now, in subscription order: the preview of the
  // server names draws these. Empty when there is no such group or none of its servers runs.
  repeated ServerSample server_samples = 3;
  // That group's name ("" with no samples).
  string sample_group = 4;
  // The instance language ("en", "ru", or "zh"). {country} itself is the two-letter code whatever the language.
  string names_language = 5;
  // People who have a live common (no device ID) place right now: the apps that report none are what STRICT turns away,
  // so the confirmation of switching to it shows this number.
  uint32 shared_link_users = 6;
  // Live AmneziaWG credentials held by the subscription link's devices, across all users. Turning link_awg off drops
  // each credential the next time its app fetches a Mihomo profile.
  uint32 link_awg_keys = 7;
  // What an own response header may not be named, from the code that sets the headers: exact names, and prefixes written with a
  // trailing "*" ("X-Hwid-*"). Compared without regard to case. The panel refuses such a name on save; the editor shows it first.
  repeated string reserved_header_names = 8;
}

// One server of the preview: what a server name is built from.
message ServerSample {
  string node = 1;
  string country_code = 2;
  string profile = 3;
  // Current node utilization, only when the panel has capacity and a fresh agent sample.
  optional uint32 load_percent = 4;
}

message UpdateSubscriptionSettingsRequest {
  // Replaces all settings. Owner or admin.
  SubscriptionSettings settings = 1;
}

message UpdateSubscriptionSettingsResponse {
  SubscriptionSettings settings = 1;
}

message ClientInfo {
  // Stable id ("happ", "amnezia", "mihomo", …) and display name.
  string id = 1;
  string name = 2;
  // Protocol plugin ids this client can use ("hysteria2", "awg").
  repeated string protocols = 3;
  // Formats this client understands.
  repeated SubFormat formats = 4;
}

message ListClientsRequest {}

message ListClientsResponse {
  repeated ClientInfo clients = 1;
}

message TestUserAgentRequest {
  string user_agent = 1;
}

message TestUserAgentResponse {
  // Index into settings.rules; -1 = no rule matched (fallback).
  int32 rule_index = 1;
  SubFormat format = 2;
  // True when the fallback treated the User-Agent as a browser.
  bool browser = 3;
}

message PreviewResponseHeadersRequest {
  string user_id = 1;
  string user_agent = 2;
  // The list to preview: the editor's draft, or the saved one.
  repeated ResponseHeader headers = 3;
}

// One header as it goes out.
message SentHeader {
  string name = 1;
  // As sent: with "base64:" and the encoded text when the entry asks for base64.
  string value = 2;
  bool base64 = 3;
}

message PreviewResponseHeadersResponse {
  // The answer format the User-Agent gets (SUB_FORMAT_USER_PAGE for a browser: the page, not a subscription).
  SubFormat format = 1;
  // The own headers that person's answer carries, in the order they are listed. Empty when the answer is not a subscription
  // (see not_served) or no entry applies.
  repeated SentHeader headers = 2;
  // Why there are none by design: "page" (a browser gets the user page), "decoy" (the User-Agent is served as an unknown link),
  // "no_access" (the person's subscription is off, expired or over its quota: the answer carries a note and no own headers).
  // "" = the answer is a subscription.
  string not_served = 3;
  // The person's group, for the preview's caption.
  string group_name = 4;
  // The saved routing profile is in the answer: its link is the `routing` entry of headers (Happ and INCY only). The header does not
  // fit (the link is over 3000 bytes) and the link is on a line of the body: routing_in_body, and no `routing` entry.
  bool routing_in_body = 5;
}

message PreviewRoutingProfileRequest {
  // A link, a base64 text or the JSON of a profile.
  string input = 1;
}

message PreviewRoutingProfileResponse {
  // The entry for the list: profile as stored, only_add from the link (add = true), info with dropped_fields.
  RoutingProfile profile = 1;
}

message PreviewMihomoTemplateRequest {
  string user_id = 1;
  // The text of the draft, checked as a save checks it (and against the saved switch of automatic selection).
  string yaml = 2;
  // The groups the draft is for; none: the warning "unused". The person need not be in one of them.
  repeated string group_ids = 3;
}

// One finding that does not stop a save (SubscriptionService words them by code). code is one of: no_server_group (no group takes the
// servers of the person: include-all-proxies, or Auto), own_dns (the person's DNS preset is not applied to this template),
// preset_rules_skipped (the preset has ad, split or country rules that a template does not get), own_auto (the template has its own
// Auto, so the panel adds none), unknown_rule_target (arg: the last field of a rule that names no proxy or group), unused (no group).
message MihomoWarning {
  string code = 1;
  string arg = 2;
}

message PreviewMihomoTemplateResponse {
  // The profile: the servers of the person with their name, type, address and port only (no credential), around the template. When
  // not_served is set, the profile the person gets instead (the panel's own).
  string yaml = 1;
  repeated MihomoWarning warnings = 2;
  // The person's group, for the preview's caption.
  string group_name = 3;
  // Why the person does not get the template: "no_access" (their subscription is off, expired or over its quota: the answer is a note)
  // or "no_servers" (none of their servers can be in a Mihomo profile). "" = the template.
  string not_served = 4;
}
