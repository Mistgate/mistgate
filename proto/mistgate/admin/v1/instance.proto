syntax = "proto3";

package mistgate.admin.v1;

// InstanceService is the brand and look of this installation, shown on the admin sign-in
// page, in the admin UI and (later) on the subscription page.
//
// The logo is also served without a session as GET brand/logo.svg next to the admin UI
// (and under the subscription prefix): image/svg+xml, sanitised, 404 when there is none.
service InstanceService {
  // Any signed-in admin.
  rpc GetInstance(GetInstanceRequest) returns (GetInstanceResponse);
  // Owner only. Absent fields are left unchanged.
  rpc UpdateInstance(UpdateInstanceRequest) returns (UpdateInstanceResponse);
}

message Instance {
  // The wordmark is brand_head in the text colour followed by brand_tail in the accent
  // colour, e.g. "mist" + "gate". Together they are the brand name ("Mistgate" by default).
  string brand_head = 1;
  string brand_tail = 2;
  // "#rrggbb", lower case.
  string accent = 3;
  // Default UI language for new browsers, "en" or "ru".
  string language = 4;
  // A custom logo is set (GET brand/logo.svg).
  bool has_logo = 5;
  // Changes with the logo, for cache busting (?v=...). Empty without a logo.
  string logo_version = 6;
  // Read-only, filled for the owner only (empty for everyone else): where the admin is reached, and the base of every
  // subscription link up to and including its secret prefix ("" when no public address is set). Both are set by
  // `mistgate setup` on the panel server.
  string admin_url = 7;
  string subscription_base = 8;
}

message GetInstanceRequest {}

message GetInstanceResponse {
  Instance instance = 1;
}

message UpdateInstanceRequest {
  // 1-24 characters of letters, digits, space and - . _ ; the tail may be empty.
  optional string brand_head = 1;
  optional string brand_tail = 2;
  // "#rrggbb".
  optional string accent = 3;
  // "en" or "ru".
  optional string language = 4;
  // SVG source, at most 64 KB. It is sanitised on the way in: scripts, foreign objects,
  // event handlers, links, animation and external references are removed. "" removes the logo.
  optional string logo_svg = 5;
}

message UpdateInstanceResponse {
  Instance instance = 1;
}
