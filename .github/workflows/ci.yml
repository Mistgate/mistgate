name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  race:
    # The agent session (panel and node) is concurrent by design; the race detector guards it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # fleet alone takes 6-10 min under -race on a hosted runner; the default 10 min timeout cut it once
      - run: go test -race -count=1 -timeout 20m ./internal/panel/fleet/ ./internal/node/agent/
  edge-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: GOOS=js GOARCH=wasm go build ./internal/panel/... ./cmd/mistgate/ ./cmd/mistgate-edge
      - name: edge-entry wasm size
        run: |
          wasm="$RUNNER_TEMP/mistgate-edge.wasm"
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -trimpath -o "$wasm" ./cmd/mistgate-edge
          bytes=$(stat -c%s "$wasm")
          echo "edge-entry wasm size: ${bytes} bytes (limit: 52428800 bytes); headroom: $((52428800 - bytes)) bytes ($(( (52428800 - bytes) / 1024 )) KiB)"
          if [ "$bytes" -gt 52428800 ]; then exit 1; fi
      - run: pwsh -File scripts/test-edge-store.ps1
      - run: pwsh -File scripts/test-edge-entry.ps1

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile && pnpm build # the panel embeds web/dist
      - run: go vet ./...
      - run: go test ./...
      - run: shellcheck scripts/install.sh
      # Debian trixie exercises the OpenSSL fallback, including releases without panel-manifest.sshsig.
      - name: Installer tests (Debian trixie OpenSSL fallback)
        env:
          MISTGATE_RELEASE_PUBLIC_KEY: ${{ vars.MISTGATE_RELEASE_PUBLIC_KEY }}
        run: |
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/scripts.test" ./scripts
          docker run --rm -v "$PWD:/w:ro" -v "$RUNNER_TEMP/scripts.test:/scripts.test:ro" -w /w/scripts \
            -e MISTGATE_INSTALL_REQUIRE_OPENSSL=1 -e MISTGATE_RELEASE_PUBLIC_KEY \
            debian:trixie-slim sh -c 'apt-get update -qq && apt-get install -y -qq bash curl openssl openssh-client >/dev/null && /scripts.test -test.v -test.count=1'
      # Ubuntu's OpenSSL 3.0 cannot verify Ed25519ctx, so this proves the SSHSIG path is used.
      - name: Installer tests (Ubuntu ssh-keygen)
        env:
          MISTGATE_INSTALL_REQUIRE_SSH_KEYGEN: "1"
          MISTGATE_RELEASE_PUBLIC_KEY: ${{ vars.MISTGATE_RELEASE_PUBLIC_KEY }}
        run: go test -count=1 ./scripts
      - run: go build ./...
      # GO-2026-5288 (an OOM in hysteria's QUIC sniffer) is fixed upstream by apernet/hysteria#1547, which v2.12.3
      # includes, but the vulnerability database names no fixed version; it is skipped, any other called one fails.
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -format json ./... > vuln.json
          n=$(jq -s '[.[] | .finding? // empty | select(.osv != "GO-2026-5288" and .trace[0].function != null)] | length' vuln.json)
          if [ "$n" -gt 0 ]; then go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...; exit 1; fi

  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go tool buf lint

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm --dir site install --frozen-lockfile
      - run: pnpm --dir site build
      - run: pnpm --dir site test

  watcher-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: deploy/cloudflare-watcher/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: deploy/cloudflare-watcher/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: deploy/cloudflare-watcher
      - run: pnpm typecheck
        working-directory: deploy/cloudflare-watcher
      - run: pnpm test
        working-directory: deploy/cloudflare-watcher

  edge-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: edge/worker/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: edge/worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: edge/worker
      - run: pnpm typecheck
        working-directory: edge/worker
      - run: pnpm test
        working-directory: edge/worker
