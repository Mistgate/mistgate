name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build embedded admin panel
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: Build panel binaries
        id: build
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_KEY: ${{ vars.MISTGATE_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must be semantic version vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ -z "$RELEASE_KEY" ]]; then
            echo "Set the repository variable MISTGATE_RELEASE_PUBLIC_KEY before creating a release" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_KEY" =~ ^[A-Za-z0-9+/]{43}=$ ]]; then
            echo "MISTGATE_RELEASE_PUBLIC_KEY must be a base64-encoded Ed25519 public key" >&2
            exit 1
          fi
          key_bytes="$(printf '%s' "$RELEASE_KEY" | base64 --decode 2>/dev/null | wc -c)"
          if [[ "$key_bytes" -ne 32 ]]; then
            echo "MISTGATE_RELEASE_PUBLIC_KEY must decode to 32 bytes" >&2
            exit 1
          fi
          mkdir -p release
          built="$(git log -1 --format=%ct)"
          printf 'version=%s\nbuilt=%s\n' "$TAG" "$built" > release/BUILDINFO
          bi="github.com/mistgate/mistgate/internal/buildinfo"
          ldflags=(-s -w -X "${bi}.Version=${TAG}" -X "${bi}.Built=${built}")
          if [[ -n "$RELEASE_KEY" ]]; then
            ldflags+=( -X "${bi}.ReleaseKey=${RELEASE_KEY}" )
          fi
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "${ldflags[*]}" \
              -o "release/mistgate-linux-${arch}" ./cmd/mistgate
          done
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "${ldflags[*]}" \
              -o "release/mistgate-node-linux-${arch}" ./cmd/mistgate-node
          done
          (
            cd release
            checksums=(mistgate-linux-amd64 mistgate-linux-arm64 mistgate-node-linux-amd64 mistgate-node-linux-arm64)
            sha256sum "${checksums[@]}" > SHA256SUMS
          )
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          assets=(release/mistgate-linux-amd64 release/mistgate-linux-arm64 release/mistgate-node-linux-amd64 release/mistgate-node-linux-arm64 release/SHA256SUMS release/BUILDINFO)
          gh release create "$TAG" "${assets[@]}" --draft --title "$TAG" --generate-notes
          echo "::notice::Release is a draft until the owner signs the node bundle and uploads manifest.json and manifest.sig. Publish it only after both signature files are attached."
