name: release

on:
  push:
    tags: ["v*"]

# Nothing may write by default: only the publish job, which runs no project or third-party build code, gets
# contents: write. Actions are pinned to commit SHAs (the tag in the comment is what the SHA was).
permissions: {}

jobs:
  # The node agents: Go only, no Node.js and no npm packages in this job.
  node:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check the tag and the release key
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_KEY: ${{ vars.MISTGATE_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(dev|testing)\.[1-9][0-9]*)?$ ]]; then
            echo "release tag must be vX.Y.Z, vX.Y.Z-testing.N or vX.Y.Z-dev.N with canonical numbers" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_KEY" =~ ^[A-Za-z0-9+/]{43}=$ ]] || [[ "$(printf '%s' "$RELEASE_KEY" | base64 --decode 2>/dev/null | wc -c)" -ne 32 ]]; then
            echo "Set the repository variable MISTGATE_RELEASE_PUBLIC_KEY (a base64 Ed25519 public key) before creating a release" >&2
            exit 1
          fi
          INSTALLER_KEY=$(sed -n 's/^readonly RELEASE_PUBLIC_KEY_BASE64="\([^"]*\)"$/\1/p' scripts/install.sh)
          if [[ "$RELEASE_KEY" != "$INSTALLER_KEY" ]]; then
            echo "scripts/install.sh release key differs from MISTGATE_RELEASE_PUBLIC_KEY" >&2
            exit 1
          fi
      - name: Check stable and testing tag ancestry
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ -dev\.[1-9][0-9]*$ ]]; then
            echo "Development releases may be tagged from any commit."
            exit 0
          fi
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          tagged_commit=$(git rev-parse "$TAG^{commit}")
          found=0
          branches=(origin/main)
          while IFS= read -r branch; do
            branches+=("$branch")
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/release/)
          for branch in "${branches[@]}"; do
            if ! git rev-parse --verify --quiet "$branch^{commit}" >/dev/null; then
              continue
            fi
            if git merge-base --is-ancestor "$tagged_commit" "$branch"; then
              found=1
              break
            fi
          done
          if [[ "$found" != "1" ]]; then
            echo "stable and testing tags must point to a commit on origin/main or an origin/release/* branch" >&2
            exit 1
          fi
      - name: Build node binaries
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_KEY: ${{ vars.MISTGATE_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p release
          printf 'version=%s\nbuilt=%s\ncommit=%s\n' "$TAG" "$(git log -1 --format=%ct)" "$(git rev-parse HEAD)" > release/BUILDINFO
          go run ./cmd/mistgate release build --version "$TAG" --key "$RELEASE_KEY" --out release \
            mistgate-node-linux-amd64 mistgate-node-linux-arm64
          # the network (ASN) table from iptoasn.com: a release does not wait for a third-party site, it goes out without
          # the table (and the nodes keep the one they have) when the source is down, stale or too small
          go run ./cmd/mistgate release asndb --out release/mistgate-asndb-data-any \
            || echo "::warning::No ASN table in this release: release asndb failed (see above)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node
          path: release/
          if-no-files-found: error

  # The panel embeds the admin SPA, so this job runs pnpm (third-party code) — with read-only permissions.
  panel:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build embedded admin panel
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: Build panel binaries
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_KEY: ${{ vars.MISTGATE_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p release
          go run ./cmd/mistgate release build --version "$TAG" --key "$RELEASE_KEY" --out release \
            mistgate-linux-amd64 mistgate-linux-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: panel
          path: release/
          if-no-files-found: error

  # The Cloudflare edition: the five panel roles for js/wasm, the six Worker scripts (esbuild, pinned in edge/worker/package.json) and the
  # admin SPA in one deterministic tarball, mistgate-edge.tar.gz. It runs pnpm (third-party code), so read-only too; the
  # bundle is loaded in workerd before it is uploaded. The owner signs it later (edge-manifest.json, edge-manifest.sig).
  edge:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build the admin panel and install the pinned esbuild
        run: |
          (cd web && pnpm install --frozen-lockfile && pnpm build)
          (cd edge/worker && pnpm install --frozen-lockfile)
      - name: Build the edge bundle
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_KEY: ${{ vars.MISTGATE_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p release
          go run ./cmd/mistgate release build --version "$TAG" --key "$RELEASE_KEY" --out release mistgate-edge.tar.gz
      - name: Load the bundle in workerd
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/edge-bundle"
          tar -xzf release/mistgate-edge.tar.gz -C "$RUNNER_TEMP/edge-bundle"
          cd edge/worker
          MISTGATE_EDGE_BUNDLE="$RUNNER_TEMP/edge-bundle" pnpm exec vitest run --project bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: edge
          path: release/
          if-no-files-found: error

  publish:
    needs: [node, panel, edge]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - name: Add the installer to the release
        run: cp scripts/install.sh release/install.sh
      - name: Publish the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          bins=(mistgate-linux-amd64 mistgate-linux-arm64 mistgate-node-linux-amd64 mistgate-node-linux-arm64 mistgate-edge.tar.gz)
          [ ! -f mistgate-asndb-data-any ] || bins+=(mistgate-asndb-data-any)
          sha256sum "${bins[@]}" > SHA256SUMS
          channel=stable
          release_flags=()
          if [[ "$TAG" =~ -testing\.[1-9][0-9]*$ ]]; then
            channel=testing
            release_flags+=(--prerelease --latest=false)
          elif [[ "$TAG" =~ -dev\.[1-9][0-9]*$ ]]; then
            channel=dev
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${bins[@]}" SHA256SUMS BUILDINFO install.sh --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft --title "$TAG" --generate-notes "${release_flags[@]}"
          echo "::notice::The $channel release stays a draft until the owner rebuilds the binaries and edge bundle from the tag, validates and signs mistgate-asndb-data-any (when the release has it) with mistgate release sign, and uploads manifest.json, manifest.sig, panel-manifest.json, panel-manifest.sig, panel-manifest.sshsig, edge-manifest.json and edge-manifest.sig. Publish it only after all seven are attached."
