name: wiki
# Publishes docs/ as the repository's GitHub Wiki (generated by site/wiki.mjs). Edit the docs, not the wiki.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/wiki.mjs"
      - "site/src/urls.mjs"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm --dir site install --frozen-lockfile
      - name: Generate and push the wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          wiki="$RUNNER_TEMP/wiki"
          # a wiki that was never initialised (no first page created in the UI) has no git repository yet
          if ! git clone --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" "$wiki" 2>/dev/null; then
            echo "::notice::The wiki repository cannot be cloned. Enable Wiki in the repository settings and create its first page once (Wiki > Create the first page); the next run will publish."
            exit 0
          fi
          pnpm --dir site wiki -- --out "$wiki" --clean
          cd "$wiki"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Wiki: sync from docs/ at ${GITHUB_SHA::7}"
          git push --quiet origin HEAD
