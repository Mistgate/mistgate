<g class="sand"><rect class="chip" x="24" y="262" width="24" height="24" rx="7"/><svg x="29" y="267" width="14" height="14" viewBox="0 0 24 24"><path class="ico" d="M9 4L3 6.5V20l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4zM9 4v13.5M15 6.5V20"/></svg></g>
