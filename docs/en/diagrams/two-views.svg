<g class="sky"><path class="flow wide" d="M460 78L489 78"/><path class="head" d="M496 78l-8 -4.5v9z"/></g>
<text class="m" x="596" y="150" text-anchor="middle">gstatic.com/generate_204</text>
<text class="m" x="596" y="166" text-anchor="middle">cloudflare.com/cdn-cgi/trace</text>
<text class="s" x="24" y="164">Client-eye checks: the panel is</text>
<text class="s" x="24" y="181">outside the country of your users,</text>
<text class="s" x="24" y="198">so it cannot see a block there.</text>
