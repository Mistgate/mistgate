<text class="t" x="86" y="329" text-anchor="middle">Globalping</text>
<rect class="pill" x="160" y="304" width="124" height="40" rx="11"/>
<text class="t" x="222" y="329" text-anchor="middle">Block lists</text>
<rect class="pill" x="296" y="304" width="124" height="40" rx="11"/>
<text class="t" x="358" y="329" text-anchor="middle">TSPU probe</text>
<rect class="pill" x="432" y="304" width="124" height="40" rx="11"/>
<text class="t" x="494" y="329" text-anchor="middle">cheburcheck</text>
<rect class="pill" x="568" y="304" width="124" height="40" rx="11"/>
<text class="t" x="630" y="329" text-anchor="middle">bsbord</text>
<g class="sand"><path class="flow dash" d="M630 304L630 200L430 200L430 135"/><path class="head" d="M430 128l-4.5 8h9z"/></g>
<rect class="card" x="24" y="372" width="672" height="40" rx="12"/>
