<text class="t" x="306" y="57">Node</text>
<text class="m" x="272" y="90">Hysteria2 · VLESS</text>
<text class="m" x="272" y="108">AmneziaWG</text>
<rect class="card" x="496" y="28" width="200" height="100" rx="14"/>
<g class="mint"><rect class="chip" x="508" y="40" width="24" height="24" rx="7"/><svg x="513" y="45" width="14" height="14" viewBox="0 0 24 24"><path class="ico" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg></g>
<text class="t" x="542" y="57">Two test pages</text>
<text class="s" x="508" y="86">Does the tunnel carry</text>
<text class="s" x="508" y="102">traffic? Where does it leave?</text>
