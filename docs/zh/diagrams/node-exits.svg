<g class="grey"><rect class="chip" x="458" y="108" width="22" height="22" rx="7"/><svg x="462.5" y="112.5" width="13" height="13" viewBox="0 0 24 24"><path class="ico" d="M4 5h16v5H4zM4 14h16v5H4zM7.5 7.5h.01M7.5 16.5h.01"/></svg></g>
<text class="t" x="490" y="117">直连</text>
<text class="m" x="490" y="132">节点的 IP</text>
