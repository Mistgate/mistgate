<g class="sky"><rect class="chip" x="212" y="56" width="26" height="26" rx="7"/><svg x="217" y="61" width="16" height="16" viewBox="0 0 24 24"><path class="ico" d="M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01M12 7h4M12 17h4"/></svg></g>
<text class="h" x="248" y="74">节点</text>
<text class="m" x="580" y="73" text-anchor="end">de1.example.com</text>
<rect class="pill" x="212" y="96" width="210" height="46" rx="11"/>
<g class="sage"><rect class="chip" x="224" y="108" width="22" height="22" rx="7"/><svg x="228.5" y="112.5" width="13" height="13" viewBox="0 0 24 24"><path class="ico" d="M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M8 15v4"/></svg></g>
<text class="t" x="256" y="117">Hysteria2</text>
<text class="m" x="256" y="132">出口：直连</text>
