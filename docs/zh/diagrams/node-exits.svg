<g class="sage"><rect class="chip" x="224" y="168" width="22" height="22" rx="7"/><svg x="228.5" y="172.5" width="13" height="13" viewBox="0 0 24 24"><path class="ico" d="M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M8 15v4"/></svg></g>
<text class="t" x="256" y="177">Hysteria2，WARP 副本</text>
<text class="m" x="256" y="192">出口：WARP</text>
