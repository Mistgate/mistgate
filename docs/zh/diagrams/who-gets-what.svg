<text class="t" x="220" y="159" text-anchor="end">全部</text>
<text class="s" x="40" y="189">Happ</text>
<g class="mint"><rect class="chip" x="179" y="170" width="41" height="22" rx="11"/><circle class="badge" cx="191" cy="181" r="7"/><path d="M188.5 181l2 2 3.5 -4" fill="none" stroke="var(--d-bg)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="tt" x="203" y="185" font-size="11" font-weight="700">开</text></g>
<text class="s" x="40" y="219">AmneziaVPN</text>
