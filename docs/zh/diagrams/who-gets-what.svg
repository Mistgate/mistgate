<g class="sage"><rect class="chip" x="282" y="147" width="22" height="22" rx="7"/><svg x="286.5" y="151.5" width="13" height="13" viewBox="0 0 24 24"><path class="ico" d="M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M8 15v4"/></svg></g>
