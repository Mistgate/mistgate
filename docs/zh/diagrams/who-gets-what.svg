<g class="mint"><rect class="chip" x="40" y="340" width="41" height="22" rx="11"/><circle class="badge" cx="52" cy="351" r="7"/><path d="M49.5 351l2 2 3.5 -4" fill="none" stroke="var(--d-bg)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="tt" x="64" y="355" font-size="11" font-weight="700">是</text></g>
<text class="t" x="98" y="355">de1 上的 Hysteria2</text>
<g class="grey"><rect class="chip" x="40" y="370" width="41" height="22" rx="11"/><circle class="badge" cx="52" cy="381" r="7"/><path d="M49.5 381h5" stroke="var(--d-bg)" stroke-width="1.8" stroke-linecap="round"/><text class="tt" x="64" y="385" font-size="11" font-weight="700">否</text></g>
<text class="s" x="98" y="385">nl1 上的 Hysteria2：在节点上已关闭</text>
<g class="grey"><rect class="chip" x="40" y="400" width="41" height="22" rx="11"/><circle class="badge" cx="52" cy="411" r="7"/><path d="M49.5 411h5" stroke="var(--d-bg)" stroke-width="1.8" stroke-linecap="round"/><text class="tt" x="64" y="415" font-size="11" font-weight="700">否</text></g>
<text class="s" x="98" y="415">de1 上的 AmneziaWG：她的应用都不读取它，AmneziaVPN 已关闭</text>
