<g class="mint"><rect class="chip" x="40" y="298" width="26" height="26" rx="7"/><svg x="45" y="303" width="16" height="16" viewBox="0 0 24 24"><path class="ico" d="M5 12.5l4.5 4.5L19 7.5"/></svg></g>
