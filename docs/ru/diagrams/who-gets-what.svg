<svg xmlns="http://www.w3.org/2000/svg" class="mgd" viewBox="0 0 720 452" width="720" height="452" role="img" aria-labelledby="title desc">
<title id="title">Кто какой сервер получает</title>
<desc id="desc">Алиса активна, в группе «Семья», ей можно пользоваться всеми нодами, переключатель Happ у неё включён, AmneziaVPN выключен. В группе «Семья» профили Hysteria2 и AmneziaWG. На de1 оба профиля включены, на nl1 Hysteria2 выключен. Алиса получает Hysteria2 на de1; не получает Hysteria2 на nl1, он выключен, и не получает AmneziaWG, потому что ни одно её включённое приложение его не читает.</desc>
<style>
.mgd{--d-bg:var(--mgd-bg,#ffffff);--d-box:var(--mgd-box,#f8f8f6);--d-line:var(--mgd-line,#e3e3df);--d-text:var(--mgd-text,#16161a);--d-muted:var(--mgd-muted,#6b6b73);--d-lav:var(--mgd-lav,#473a73);--d-lav-bg:var(--mgd-lav-bg,#eae8fc);--d-sky:var(--mgd-sky,#174e6a);--d-sky-bg:var(--mgd-sky-bg,#e0f0fa);--d-mint:var(--mgd-mint,#00582f);--d-mint-bg:var(--mgd-mint-bg,#dcf3e4);--d-sage:var(--mgd-sage,#3b511d);--d-sage-bg:var(--mgd-sage-bg,#e8f1e0);--d-sand:var(--mgd-sand,#5c4a12);--d-sand-bg:var(--mgd-sand-bg,#f5efdf);--d-rose:var(--mgd-rose,#67343e);--d-rose-bg:var(--mgd-rose-bg,#f9e6e8)}
@media (prefers-color-scheme:dark){.mgd{--d-bg:var(--mgd-bg,#141417);--d-box:var(--mgd-box,#0c0c0e);--d-line:var(--mgd-line,#25252b);--d-text:var(--mgd-text,#f3f3f5);--d-muted:var(--mgd-muted,#8b8b94);--d-lav:var(--mgd-lav,#b8acf2);--d-lav-bg:var(--mgd-lav-bg,#2d2b38);--d-sky:var(--mgd-sky,#8ec8ea);--d-sky-bg:var(--mgd-sky-bg,#263037);--d-mint:var(--mgd-mint,#7dd3a0);--d-mint-bg:var(--mgd-mint-bg,#243229);--d-sage:var(--mgd-sage,#b0cc90);--d-sage-bg:var(--mgd-sage-bg,#2c3126);--d-sand:var(--mgd-sand,#dcc68c);--d-sand-bg:var(--mgd-sand-bg,#332f25);--d-rose:var(--mgd-rose,#e6a6b0);--d-rose-bg:var(--mgd-rose-bg,#362a2c)}}
.mgd text{font-family:Onest,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--d-text)}
.mgd .bg{fill:var(--d-bg);stroke:var(--d-line)}
.mgd .card{fill:var(--d-box);stroke:var(--d-line)}
.mgd .pill{fill:var(--d-bg);stroke:var(--d-line)}
.mgd .h{font-size:15px;font-weight:800;letter-spacing:-.02em}
.mgd .t{font-size:13px;font-weight:700}
.mgd .s{font-size:13px;fill:var(--d-muted)}
.mgd .m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:var(--d-muted)}
.mgd .lav{--t:var(--d-lav);--tb:var(--d-lav-bg)}
.mgd .sky{--t:var(--d-sky);--tb:var(--d-sky-bg)}
.mgd .mint{--t:var(--d-mint);--tb:var(--d-mint-bg)}
.mgd .sage{--t:var(--d-sage);--tb:var(--d-sage-bg)}
.mgd .sand{--t:var(--d-sand);--tb:var(--d-sand-bg)}
.mgd .rose{--t:var(--d-rose);--tb:var(--d-rose-bg)}
.mgd .grey{--t:var(--d-muted);--tb:var(--d-line)}
.mgd .chip{fill:var(--tb)}
.mgd .ico{fill:none;stroke:var(--t);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mgd .edge{fill:var(--tb);stroke:var(--t);stroke-opacity:.45}
.mgd .flow{fill:none;stroke:var(--t);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mgd .wide{stroke-width:3}
.mgd .dash{stroke-dasharray:5 5}
.mgd .head{fill:var(--t)}
.mgd .badge{fill:var(--t)}
.mgd .bn{font-size:11px;font-weight:800;fill:var(--d-bg);text-anchor:middle}
.mgd .tt{fill:var(--t)}
.mgd .rule{stroke:var(--d-line)}
</style>
